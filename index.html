            '<div class="field"><label for="tkCat">Category (optional)</label><select class="inp" id="tkCat"><option value="'+esc(defaultCat)+'">'+esc(defaultCat)+' (General tank)</option>'+
              subCats.filter(c=>c!==defaultCat).map(c=>'<option value="'+esc(c)+'">'+esc(c)+'</option>').join('')+'</select></div>'+
            '<div class="field"><label for="tkAcc">Paid from</label><select class="inp" id="tkAcc">'+accOptions(liveAssets,defAcc)+'</select></div>'+
          '</div>'+
        '</details></form>',
      foot:'<button class="btn" data-act="modal-close">Cancel</button><button class="btn btn-primary" id="tkSave">Subtract From '+GROUP_LBL[tank]+' Tank</button>',
      onMount:function(){
        $('#fTankSpend').addEventListener('submit',function(e){e.preventDefault();$('#tkSave').click();});
        $('#tkSave').addEventListener('click',function(){
          const amt=round2(parseFloat($('#tkAmt').value));
          const errEl=$('#fTankErr');
          if(!isFinite(amt)||amt<=0){errEl.textContent='Enter an amount greater than ₱0.';errEl.classList.add('show');return;}
          const cat=($('#tkCat')&&$('#tkCat').value)||defaultCat;
          const acc=($('#tkAcc')&&$('#tkAcc').value)||defAcc;
          const desc=($('#tkDesc').value||'').trim()||(GROUP_LBL[tank]+' consumption');
          const dt=$('#tkDate').value||TODAY();
          mutate(function(){
            if(!state.settings.expenseCats.some(c=>c.name===cat))state.settings.expenseCats.push({name:cat,essential:isNeeds});
            ensureCatIds(state);
            state.transactions.push({id:uid('TXN'),date:dt,type:'expense',description:desc,amount:amt,category:cat,fromAccount:acc||null,toAccount:null,method:'',notes:'',tags:[],recurringId:null,refundOf:null});
          });
          closeModal();
          toast('Subtracted '+money(amt)+' from your '+GROUP_LBL[tank]+' tank.','ok');
        });
      }
    });
    return;
  }
  if(tank==='debts'){
    const pLines=activeDebtLines();
    const liabs=state.accounts.filter(a=>!a.archived&&LIABS.includes(a.type));
    const hasAny=pLines.length>0;
    const firstDebt=pLines[0]||null;
    const defPay=firstDebt?Math.min(debtRem(firstDebt),debtFreqAmt(debtMonthlyAmt(firstDebt,tm.inc),firstDebt.freq).amt):(tm.debts.monthly||0);
    openModal({
      title:I('card',18)+' Debts Tank (− Pay / + Add Debt)',
      body:'<form id="fTankDebt" novalidate><div class="form-err" id="fTankDebtErr"></div>'+
        '<div class="field"><label>Action</label><div class="seg" id="tkDebtModeSeg" style="width:100%">'+
          (hasAny?'<button type="button" class="on" data-debtmode="pay" style="flex:1;text-align:center">− Subtract Payment</button>'+
                  '<button type="button" data-debtmode="increase" style="flex:1;text-align:center">+ Add To This Debt</button>':'')+
          '<button type="button" class="'+(hasAny?'':'on')+'" data-debtmode="new" style="flex:1;text-align:center">+ New Debt Plan</button>'+
        '</div></div>'+
        /* Pane 1: Pay / Subtract or Increase Existing Debt */
        (hasAny?'<div id="tkDebtExistingPane">'+
          '<div class="note" id="tkDebtModeNote" style="margin-bottom:12px">Your Debts tank has <b>'+money(tm.debts.rem)+'</b> remaining of <b>'+money(tm.debts.total)+'</b>. Subtract what you paid — when it hits ₱0, the plan removes itself!</div>'+
          '<div class="field"><label for="tkDebtId">Select debt</label><select class="inp" id="tkDebtId">'+
            pLines.map(l=>'<option value="'+esc(l.id)+'">'+esc(l.name)+' — '+money(debtRem(l))+' left ('+l.months+' mo'+(l.months===1?'':'s')+' · '+money(debtMonthlyAmt(l,tm.inc))+'/mo)</option>').join('')+'</select></div>'+
          '<div class="fgrid">'+
            '<div class="field"><label for="tkDebtAmt" id="tkDebtAmtLbl">Amount paid to subtract (₱)</label><input type="number" class="inp" id="tkDebtAmt" min="0.01" step="0.01" value="'+(defPay||'')+'" placeholder="0.00" inputmode="decimal"></div>'+
            '<div class="field"><label for="tkDebtMos">Payoff months</label><input type="number" class="inp" id="tkDebtMos" min="1" max="120" step="1" value="'+(firstDebt?firstDebt.months:tm.debts.months||6)+'"></div>'+
          '</div>'+
          '<div class="fgrid">'+
            '<div class="field"><label for="tkDebtFreq">Payment preference</label><select class="inp" id="tkDebtFreq">'+
              [['monthly','Monthly'],['weekly','Weekly'],['biweekly','Every 2 weeks'],['quarterly','Quarterly']].map(o=>'<option value="'+o[0]+'"'+((firstDebt?firstDebt.freq:'monthly')===o[0]?' selected':'')+'>'+o[1]+'</option>').join('')+'</select></div>'+
            '<div class="field" id="tkDebtAccWrap"><label for="tkDebtAcc">Paid from account</label><select class="inp" id="tkDebtAcc">'+accOptions(liveAssets,defAcc)+'</select></div>'+
          '</div>'+
        '</div>':'')+
        /* Pane 2: Add a Brand New Debt Plan */
        '<div id="tkDebtNewPane" style="display:'+(hasAny?'none':'block')+'">'+
          (!hasAny?'<div class="congrats-modal-hero" style="padding:4px 0 12px">'+
             '<div class="congrats-modal-ring" style="width:56px;height:56px">'+I('sparkle',26)+'</div>'+
             '<h2 style="font-size:19px">You Have No Active Debt! 🎉</h2>'+
             '<p style="margin-bottom:8px">Add a debt below if you want to divide it across months or weeks inside your Needs share:</p>'+
           '</div>':'<div class="note" style="margin-bottom:12px">Add another debt to your plan (seated inside Needs) and divide it into months or weeks:</div>')+
          '<div class="field"><label for="tkNewDebtName">Debt name</label><input class="inp" id="tkNewDebtName" placeholder="e.g. Credit Card, Personal Loan, Gadget Loan" value="Personal Debt"></div>'+
          '<div class="fgrid">'+
            '<div class="field"><label for="tkNewDebtTot">Total debt amount (₱)</label><input type="number" class="inp" id="tkNewDebtTot" min="1" step="100" placeholder="30000" value="30000"></div>'+
            '<div class="field"><label for="tkNewDebtMos">Divide into (months)</label><input type="number" class="inp" id="tkNewDebtMos" min="1" max="120" value="6"></div>'+
          '</div>'+
          '<div class="field"><label for="tkNewDebtFreq">Payment preference</label><select class="inp" id="tkNewDebtFreq"><option value="monthly">Monthly</option><option value="weekly">Weekly</option><option value="biweekly">Every 2 weeks</option><option value="quarterly">Quarterly</option></select></div>'+
        '</div>'+
      '</form>',
      foot:'<button class="btn" data-act="modal-close">Cancel</button>'+
        (hasAny?'<button class="btn" type="button" id="tkDebtAdjOnly">Save Term Only</button><button class="btn btn-primary" id="tkDebtSave">− Subtract Payment</button>'
               :'<button class="btn btn-primary" id="tkDebtCreate">+ Add Debt To Plan</button>'),
      onMount:function(root){
        let mode=hasAny?'pay':'new';
        const sel=$('#tkDebtId');
        const syncModeUI=function(){
          root.querySelectorAll('[data-debtmode]').forEach(b=>b.classList.toggle('on',b.dataset.debtmode===mode));
          const exPane=$('#tkDebtExistingPane'),nwPane=$('#tkDebtNewPane');
          const adjBtn=$('#tkDebtAdjOnly'),saveBtn=$('#tkDebtSave');
          if(exPane)exPane.style.display=(mode==='new')?'none':'block';
          if(nwPane)nwPane.style.display=(mode==='new')?'block':'none';
          if(adjBtn)adjBtn.style.display=(mode==='pay')?'':'none';
          if(mode==='pay'){
            if($('#tkDebtAmtLbl'))$('#tkDebtAmtLbl').textContent='Amount paid to subtract (₱)';
            if($('#tkDebtModeNote'))$('#tkDebtModeNote').innerHTML='Your Debts tank has <b>'+money(tm.debts.rem)+'</b> remaining of <b>'+money(tm.debts.total)+'</b>. Subtract what you paid — when it hits ₱0, the plan removes itself!';
            if($('#tkDebtAccWrap'))$('#tkDebtAccWrap').style.display='';
            if(saveBtn)saveBtn.textContent='− Subtract Payment';
          }else if(mode==='increase'){
            if($('#tkDebtAmtLbl'))$('#tkDebtAmtLbl').textContent='Additional debt amount to add (₱)';
            if($('#tkDebtModeNote'))$('#tkDebtModeNote').innerHTML='Borrowed more on this debt? Enter the additional amount below to add it to your Debts tank and recalculate your installment.';
            if($('#tkDebtAccWrap'))$('#tkDebtAccWrap').style.display='none';
            if($('#tkDebtAmt'))$('#tkDebtAmt').value='';
            if(saveBtn)saveBtn.textContent='+ Add To Debt';
          }else{
            if(saveBtn)saveBtn.textContent='+ Add Debt To Plan';
          }
        };
        root.querySelectorAll('[data-debtmode]').forEach(b=>b.addEventListener('click',function(){
          mode=b.dataset.debtmode;syncModeUI();
        }));
        if(sel)sel.addEventListener('change',function(){
          const l=state.plan.lines.find(x=>x.id===sel.value);
          if(l){
            $('#tkDebtMos').value=l.months||6;
            $('#tkDebtFreq').value=l.freq||'monthly';
            if(mode==='pay')$('#tkDebtAmt').value=Math.min(debtRem(l),debtFreqAmt(debtMonthlyAmt(l,tm.inc),l.freq).amt);
          }
        });
        if($('#tkDebtAdjOnly'))$('#tkDebtAdjOnly').addEventListener('click',function(){
          const id=sel?sel.value:(firstDebt&&firstDebt.id);
          const mos=clamp(Math.round(parseFloat($('#tkDebtMos').value)||6),1,120);
          const freq=$('#tkDebtFreq').value||'monthly';
          mutate(function(){
            const l=state.plan&&state.plan.lines.find(x=>x.id===id);
            if(l){l.months=mos;l.freq=freq;l.amount=debtMonthlyAmt(l,state.plan.income);prunePaidDebts();syncPlanBudgets(monthKey(TODAY()),[]);}
          });
          closeModal();
          toast('Updated debt payoff plan to '+mos+' month(s) ('+FREQ_LBL[freq]+').','ok');
        });
        const createNewDebt=function(){
          const nm=($('#tkNewDebtName').value||'').trim()||'Personal Debt';
          const tot=round2(parseFloat($('#tkNewDebtTot').value));
          const mos=clamp(Math.round(parseFloat($('#tkNewDebtMos').value)||6),1,120);
          const freq=$('#tkNewDebtFreq').value||'monthly';
          const errEl=$('#fTankDebtErr');
          if(!isFinite(tot)||tot<=0){errEl.textContent='Enter a total debt amount greater than ₱0.';errEl.classList.add('show');return;}
          mutate(function(){
            if(!state.plan||!state.plan.income)state.plan={income:60000,payday:'15-30',payDay:15,split:{needs:50,wants:30,savings:20},lines:[]};
            const moAmt=round2(tot/mos);
            state.plan.lines.push({id:uid('PLN'),group:'debts',name:nm,mode:'amt',pct:null,amount:moAmt,rollover:false,target:tot,targetDate:'',paid:0,months:mos,freq:freq,icon:'card'});
            prunePaidDebts();
            syncPlanBudgets(monthKey(TODAY()),[]);
          });
          closeModal();
          toast('Added '+nm+' ('+money(tot)+' over '+mos+' months) to your Debts tank!','ok');
        };
        if($('#tkDebtCreate'))$('#tkDebtCreate').addEventListener('click',createNewDebt);
        if($('#tkDebtSave'))$('#tkDebtSave').addEventListener('click',function(){
          if(mode==='new'){createNewDebt();return;}
          const amt=round2(parseFloat($('#tkDebtAmt').value));
          const mos=clamp(Math.round(parseFloat($('#tkDebtMos').value)||6),1,120);
          const freq=$('#tkDebtFreq').value||'monthly';
          const errEl=$('#fTankDebtErr');
          if(!isFinite(amt)||amt<=0){errEl.textContent='Enter an amount greater than ₱0.';errEl.classList.add('show');return;}
          const id=sel?sel.value:(firstDebt&&firstDebt.id);
          if(mode==='increase'){
            let debtName='Debt';
            mutate(function(){
              const l=state.plan&&state.plan.lines.find(x=>x.id===id);
              if(l){
                debtName=l.name;
                l.target=round2((toNum(l.target)||debtRem(l))+amt);
                l.months=mos;
                l.freq=freq;
                l.amount=debtMonthlyAmt(l,state.plan.income);
                prunePaidDebts();
                syncPlanBudgets(monthKey(TODAY()),[]);
              }
            });
            closeModal();
            toast('Added '+money(amt)+' to '+debtName+'!','ok');
            return;
          }
          const fromAcc=($('#tkDebtAcc')&&$('#tkDebtAcc').value)||defAcc;
          let paidOffNames=[];
          let freedMo=0;
          let debtName='Debt payment';
          mutate(function(){
            const l=state.plan&&state.plan.lines.find(x=>x.id===id);
            if(l){
              debtName=l.name;
              freedMo=debtMonthlyAmt(l,state.plan.income);
              l.paid=round2((toNum(l.paid)||0)+amt);
              l.months=mos;
              l.freq=freq;
              l.amount=debtMonthlyAmt(l,state.plan.income);
            }
            const liabAcc=liabs.find(a=>a.name.toLowerCase()===debtName.toLowerCase())||liabs.find(a=>accountBalance(a.id)>0);
            if(liabAcc){
              state.transactions.push({id:uid('TXN'),date:TODAY(),type:'cc_payment',description:'Debt payment — '+debtName,amount:amt,category:'',fromAccount:fromAcc||null,toAccount:liabAcc.id,method:'Bank Transfer',notes:'Subtracted from Debts tank',tags:[],recurringId:null,refundOf:null});
            }else{
              if(!state.settings.expenseCats.some(c=>c.name==='Debt Payments'))state.settings.expenseCats.push({name:'Debt Payments',essential:true});
              ensureCatIds(state);
              state.transactions.push({id:uid('TXN'),date:TODAY(),type:'expense',description:'Debt payment — '+debtName,amount:amt,category:'Debt Payments',fromAccount:fromAcc||null,toAccount:null,method:'Bank Transfer',notes:'Subtracted from Debts tank',tags:[],recurringId:null,refundOf:null});
            }
            paidOffNames=prunePaidDebts();
          });
          closeModal();
          if(paidOffNames.length){
            toast('🎉 Congratulations! '+paidOffNames.join(', ')+' is 100% paid off and removed from your plan!','ok');
            openDebtFreeCongratsModal(paidOffNames,freedMo);
          }else{
            toast('Subtracted '+money(amt)+' from your Debts tank!','ok');
          }
        });
      }
    });
    return;
  }
  if(tank==='savings'){
    const subcats=state.goals.length?state.goals.map(g=>({id:g.id,name:g.name,saved:g.saved,target:g.target})):[{id:'__new__',name:'Emergency Fund',saved:0,target:60000}];
    const savAcc=state.accounts.find(a=>!a.archived&&a.type==='savings');
    openModal({
      title:I('flag',18)+' Savings Tank (+ Add / − Subtract)',
      body:'<form id="fTankSav" novalidate><div class="form-err" id="fTankSavErr"></div>'+
        '<div class="note" style="margin-bottom:12px">Add money to grow a savings subcategory, or subtract when you withdraw / get money from your savings.</div>'+
        '<div class="field"><label>Action</label><div class="seg" id="tkSavDirSeg" style="width:100%">'+
          '<button type="button" class="on" data-savdir="add" style="flex:1;text-align:center">+ Add to Savings (Put in)</button>'+
          '<button type="button" data-savdir="sub" style="flex:1;text-align:center">− Subtract (Get money out)</button>'+
        '</div></div>'+
        '<div class="fgrid">'+
          '<div class="field"><label for="tkSavSub">Savings subcategory</label><select class="inp" id="tkSavSub">'+
            subcats.map(s=>'<option value="'+esc(s.name)+'">'+esc(s.name)+' ('+money0(s.saved)+' saved)</option>').join('')+
            '<option value="__custom__">+ New savings subcategory…</option></select></div>'+
          '<div class="field" id="tkSavNewWrap" style="display:none"><label for="tkSavNew">New subcategory name</label><input class="inp" id="tkSavNew" placeholder="e.g. Tuition, Gadget"></div>'+
        '</div>'+
        '<div class="fgrid">'+
          '<div class="field"><label for="tkSavAmt">Amount (₱)</label><input type="number" class="inp" id="tkSavAmt" min="0.01" step="0.01" placeholder="0.00" inputmode="decimal" required></div>'+
          '<div class="field"><label for="tkSavAcc">Cash / bank account</label><select class="inp" id="tkSavAcc">'+accOptions(liveAssets.filter(a=>a.type!=='savings'),defAcc)+'</select></div>'+
        '</div></form>',
      foot:'<button class="btn" data-act="modal-close">Cancel</button><button class="btn btn-primary" id="tkSavSave">+ Add To Savings</button>',
      onMount:function(root){
        let dir='add';
        root.querySelectorAll('[data-savdir]').forEach(b=>b.addEventListener('click',function(){
          dir=b.dataset.savdir;
          root.querySelectorAll('[data-savdir]').forEach(x=>x.classList.toggle('on',x.dataset.savdir===dir));
          $('#tkSavSave').textContent=dir==='add'?'+ Add To Savings':'− Subtract From Savings';
        }));
        $('#tkSavSub').addEventListener('change',function(){
          $('#tkSavNewWrap').style.display=$('#tkSavSub').value==='__custom__'?'':'none';
        });
        $('#fTankSav').addEventListener('submit',function(e){e.preventDefault();$('#tkSavSave').click();});
        $('#tkSavSave').addEventListener('click',function(){
          const amt=round2(parseFloat($('#tkSavAmt').value));
          const errEl=$('#fTankSavErr');
          if(!isFinite(amt)||amt<=0){errEl.textContent='Enter an amount greater than ₱0.';errEl.classList.add('show');return;}
          let subName=$('#tkSavSub').value;
          if(subName==='__custom__'){
            subName=($('#tkSavNew').value||'').trim();
            if(!subName){errEl.textContent='Enter a name for the new savings subcategory.';errEl.classList.add('show');return;}
          }
          let goal=state.goals.find(g=>g.name.toLowerCase()===subName.toLowerCase());
          if(dir==='sub'&&goal&&goal.saved<amt){
            errEl.textContent='Only '+money(goal.saved)+' is available in "'+goal.name+'".';errEl.classList.add('show');return;
          }
          const bankId=($('#tkSavAcc')&&$('#tkSavAcc').value)||defAcc;
          mutate(function(){
            if(!goal){
              goal={id:uid('GOL'),name:subName,target:Math.max(amt*6,30000),saved:0,targetDate:addMonthsISO(TODAY(),12),monthlyContribution:amt};
              state.goals.push(goal);
            }
            goal.saved=Math.max(0,round2(goal.saved+(dir==='add'?amt:-amt)));
            if(state.plan&&Array.isArray(state.plan.lines)&&!state.plan.lines.some(l=>l.group==='savings'&&l.name.toLowerCase()===subName.toLowerCase())){
              state.plan.lines.push({id:uid('PLN'),group:'savings',name:subName,mode:'amt',pct:null,amount:amt,rollover:false,target:goal.target,targetDate:goal.targetDate||'',paid:0,months:0,freq:'monthly',icon:'flag'});
            }
            if(savAcc&&bankId&&savAcc.id!==bankId){
              state.transactions.push({
                id:uid('TXN'),date:TODAY(),type:'transfer',
                description:(dir==='add'?'Savings deposit — ':'Savings withdrawal — ')+subName,
                amount:amt,category:'',
                fromAccount:dir==='add'?bankId:savAcc.id,
                toAccount:dir==='add'?savAcc.id:bankId,
                method:'Bank Transfer',notes:dir==='add'?'Added to Savings tank':'Subtracted (got money) from Savings tank',tags:[],recurringId:null,refundOf:null
              });
            }
          });
          closeModal();
          toast((dir==='add'?'Added ':'Subtracted (withdrew) ')+money(amt)+(dir==='add'?' to ':' from ')+subName+'.','ok');
        });
      }
    });
  }
}

function safeHTML(){
  const s=safeToSpend();
  const row=function(l,v,cls){return '<div class="safe-r'+(cls?' '+cls:'')+'"><span>'+l+'</span><span class="num">'+v+'</span></div>';};
  const sub=s.left>0?(money0(s.left)+' left for '+s.days+(s.days===1?' day':' days')+', until '+fmtDShort(s.end))
    :(s.income+s.incomeDue>0?'Over by '+money0(-s.left)+'. More spending now eats into bills or savings.':'Add your pay as a bill (Bills \u2192 Income) so Badyet knows what\u2019s coming in.');
  return '<section class="safe" aria-label="Safe to spend today">'+
    '<div class="safe-lb">Safe To Spend Today</div>'+
    '<div class="safe-v">'+money0(s.perDay)+'<small> / day</small></div>'+
    '<div class="safe-sub">'+esc(sub)+'</div>'+
    '<details class="safe-how"><summary>How It\u2019s Worked Out</summary>'+
      row('Income received',money0(s.income))+
      (s.incomeDue?row('Pay still coming','+'+money0(s.incomeDue)):'')+
      row('Bills still due'+(s.nBills?' ('+s.nBills+')':''),'\u2212'+money0(s.billsDue))+
      (s.goals?row('Goal savings','\u2212'+money0(s.goals)):'')+
      row('Already spent','\u2212'+money0(s.spent))+
      row('Left \u00f7 '+s.days+(s.days===1?' day':' days'),(s.left<0?'\u2212':'')+money0(Math.abs(s.left)),'tot')+
    '</details></section>';
}
function miniHTML(lb,sec,val){return '<button class="mini" data-act="nav" data-sec="'+sec+'"><div class="lb">'+lb+'</div><div class="vl">'+val+'</div></button>';}
RENDER.dashboard=function(){
  dashCache=null;
  const k=ui.month,today=TODAY(),isCur=k===monthKey(today);
  const metric=ui.dash.metric||'spent';
  const months=[];for(let i=5;i>=0;i--)months.push(monthAdd(k,-i));
  const sums=months.map(function(m){return periodSummary(monthTxns(m));});
  const pick=function(s){return metric==='earned'?s.income:metric==='left'?s.net:s.netExpense;};
  const vals=sums.map(pick),S=sums[5],big=vals[5];
  const tb=totalBudget(k);
  const mLbl=monthLabel(k);
  let sub;
  if(metric==='spent')sub=tb>0?(pctStr(S.netExpense/tb*100)+' of your '+money0(tb)+' budget'):'spent in '+mLbl;
  else if(metric==='earned')sub='earned in '+mLbl;
  else sub='earned minus spent'+(S.savingsRate!=null?', '+pctStr(S.savingsRate)+' kept':'');
  const cash=availableCash(),tm=tankMetrics(k),sDay=safeToSpend();
  const list=monthTxns(k).slice().sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:0;});
  const showAct=!!ui.dash.showActivity;

  const left='<section class="hero">'+
    '<div class="hero-pills">'+[['spent','Spent'],['earned','Earned'],['left','Left Over']].map(function(p){
      return '<button class="pill'+(metric===p[0]?' on':'')+'" data-act="dash-metric" data-m="'+p[0]+'">'+p[1]+'</button>';}).join('')+'</div>'+
    '<div class="hero-num">'+(big<0?'−':'')+money(Math.abs(big))+'</div>'+

function filteredTxns(){
  const f=ui.txn,q=f.q.toLowerCase();
  let list=state.transactions.filter(function(t){
    if(q&&!(t.description.toLowerCase().includes(q)||(t.notes||'').toLowerCase().includes(q)||t.tags.some(function(x){return x.toLowerCase().includes(q);})))return false;
    if(f.type&&t.type!==f.type)return false;
    if(f.cat&&t.category!==f.cat)return false;
    if(f.acc&&t.fromAccount!==f.acc&&t.toAccount!==f.acc)return false;
    if(f.from&&t.date<f.from)return false;
    if(f.to&&t.date>f.to)return false;
    return true;});
  list.sort(function(a,b){
    const va=a[f.sort],vb=b[f.sort];
    const c=va<vb?-1:va>vb?1:0;
    return f.dir==='asc'?c:-c;});
  return list;
}

  const catMax=cats.length?Math.max(cats[0][1],0.0001):1;
  const pk=monthAdd(k,-1);
  const prevMap=netSpendByCat(monthTxns(pk));
  const catRows=cats.map(function(c){
    const prev=prevMap[c[0]]||0;
    let sub='no prior-month data';
    if(prev>0){const chg=Math.round((c[1]-prev)/prev*100);sub='prev: '+money(prev)+' ('+(chg>=0?'+':'')+chg+'%)';}

  }).join('');

  const merPrev={};for(const t of monthTxns(pk)){if(t.type!=='expense')continue;const key=t.description.toLowerCase().trim();(merPrev[key]=merPrev[key]||{total:0}).total+=t.amount;}
  const topMer=Object.values(mer).sort(function(a,b){return b.total-a.total;}).slice(0,10);
  let fixed=0,variable=0;
  for(const t of tx){if(t.type==='expense'){if(t.recurringId)fixed+=t.amount;else variable+=t.amount;}else if(t.type==='refund')variable-=t.amount;}
  let ess=0,dis=0;
  for(const c in spendMap){const meta=state.settings.expenseCats.find(function(x){return x.name===c;});if(meta&&meta.essential)ess+=spendMap[c];else dis+=spendMap[c];}
  const histN=clamp(ui.an.hist,3,12);
  const monthsH=[];for(let i=histN-1;i>=0;i--)monthsH.push(monthAdd(k,-i));
  const base=categoryBaseline();

    if(avg>0&&spent>avg*1.5&&spent-avg>=1000&&!state.dismissed.includes('anom:'+c+':'+k))anoms.push({cat:c,spent:spent,avg:avg});}
  const expTx=tx.filter(function(t){return t.type==='expense';});
  const medians={};for(const c in spendMap){const arr=expTx.filter(function(t){return t.category===c;}).map(function(t){return t.amount;}).sort(function(a,b){return a-b;});medians[c]=arr.length?arr[Math.floor(arr.length/2)]:0;}
  const txAnoms=expTx.filter(function(t){return !state.exceptions.includes(t.id)&&medians[t.category]>0&&t.amount>medians[t.category]*3&&t.amount>=2000;}).slice(0,5);
  const D=dim(k),cut=(k===monthKey(today)?dayOfPeriod(today):D);
  const daily=new Array(cut).fill(0);
  for(const t of tx){const d=dayOfPeriod(t.date);if(d>cut||d<1)continue;if(t.type==='expense')daily[d-1]+=t.amount;else if(t.type==='refund')daily[d-1]-=t.amount;}
  const weeks=[];for(let w=0;w<D/7;w++){let s=0;for(let d=w*7+1;d<=Math.min(D,(w+1)*7);d++){if(d<=cut)s+=daily[d-1];}weeks.push({lb:'W'+(w+1),v:round2(s)});}
  const hasDaily=daily.some(function(v){return v!==0;});
  const firstData=state.transactions.length?state.transactions.reduce(function(m,t){return t.date<m?t.date:m;},'9999'):null;
  const monthsAvail=firstData?monthsH.filter(function(m){return m>=monthKey(firstData);}).length:0;

    '<div class="panel"><div class="panel-head"><h3>Day By Day</h3></div><div class="panel-body">'+
    (hasDaily?svgLine({labels:daily.map(function(_,i){return String(i+1);}),series:[{name:'Daily net spend',color:'var(--ink)',data:daily.map(function(v){return round2(v);}),area:true}]}):nochart('No spending yet this month.'))+
      '<div class="subhead" style="margin-top:14px">Weekly totals</div>'+
      svgBars({labels:weeks.map(function(x){return x.lb;}),series:[{name:'Weekly spend',color:'var(--ink)',data:weeks.map(function(x){return x.v;})}],emptyMsg:'No spending yet this month.'})+
    '</div></div>'+
    '<div class="panel"><div class="panel-head"><h3>Over Time</h3><div class="seg" style="margin-left:auto">'+
      [3,6,12].map(function(n){return '<button data-act="an-hist" data-n="'+n+'"'+(ui.an.hist===n?' class="on"':'')+'>'+n+'m</button>';}).join('')+'</div></div><div class="panel-body">'+
      svgBars({labels:monthsH.map(function(m){return MONS[Number(m.slice(5))-1];}),series:[{name:'Income',color:'var(--ink)',data:monthsH.map(function(m){return periodSummary(monthTxns(m)).income;})},{name:'Expenses',color:'var(--c2)',data:monthsH.map(function(m){return periodSummary(monthTxns(m)).netExpense;})}],emptyMsg:'No history yet.'})+
      '<div class="legend"><span class="li"><span class="sw" style="background:var(--ink)"></span>Income</span><span class="li"><span class="sw" style="background:var(--c2)"></span>Expenses</span></div>'+
      (monthsAvail<histN?('<div class="note" style="margin-top:10px">Only '+monthsAvail+' month(s) of data in this window; it fills in as history accumulates.</div>'):'')+
    '</div></div>'+
  '</div>'+

  '<div class="grid g-3">'+
    '<div class="panel"><div class="panel-head"><h3>Fixed Vs. Flexible</h3></div><div class="panel-body">'+
      '<div class="kv"><span class="k">Fixed (from schedules)</span><span class="v">'+money(fixed)+'</span></div>'+
      '<div style="margin:6px 0">'+meterHTML(fixed,Math.max(fixed+variable,0.001)*1.0001)+'</div>'+
      '<div class="kv"><span class="k">Variable</span><span class="v">'+money(variable)+'</span></div>'+
      '<div style="margin:6px 0 8px">'+meterHTML(variable,Math.max(fixed+variable,0.001)*1.0001)+'</div>'+
      '<div class="note">Fixed = transactions linked to a recurring schedule (rent, subscriptions, etc.). Everything else is treated as variable.</div></div></div>'+
    '<div class="panel"><div class="panel-head"><h3>Needs Vs. Wants</h3></div><div class="panel-body">'+
      '<div class="kv"><span class="k">Essential</span><span class="v">'+money(ess)+'</span></div>'+
      '<div style="margin:6px 0">'+meterHTML(ess,Math.max(ess+dis,0.001)*1.0001)+'</div>'+
      '<div class="kv"><span class="k">Discretionary</span><span class="v">'+money(dis)+'</span></div>'+
      '<div style="margin:6px 0 8px">'+meterHTML(dis,Math.max(ess+dis,0.001)*1.0001)+'</div>'+
      '<div class="subhead">Tap to toggle essential</div>'+
      '<div class="split-btns">'+state.settings.expenseCats.map(function(c){return '<button class="btn btn-sm '+(c.essential?'btn-teal':'')+'" data-act="cat-toggle" data-cat="'+esc(c.name)+'">'+esc(c.name)+(c.essential?' \u2713':'')+'</button>';}).join('')+'</div>'+
    '</div></div>'+
    '<div class="panel"><div class="panel-head"><h3>Top Places</h3></div><div class="panel-body" style="padding-top:4px">'+
      (topMer.length?('<div class="table-scroll"><table class="tbl"><thead><tr><th>Merchant</th><th class="r">This month</th><th class="r">Prev</th><th class="r">Change</th></tr></thead><tbody>'+
      topMer.map(function(m){const p=(merPrev[m.name.toLowerCase().trim()]||{}).total||0;
        const chg=p>0?Math.round((m.total-p)/p*100):null;
        return '<tr class="rowlink" data-act="drill" data-q="'+esc(m.name)+'" data-from="'+monthStart(k)+'" data-to="'+monthEnd(k)+'"><td><b>'+esc(m.name)+'</b><div style="font-size:11px;color:var(--muted)">'+m.count+' purchase(s)</div></td><td class="amt">'+money(m.total)+'</td><td class="amt">'+money(p)+'</td><td class="amt">'+(chg==null?'\u2014':(chg>0?'+':'')+chg+'%')+'</td></tr>';}).join('')+'</tbody></table></div>'):'<div class="note">No merchant purchases this month.</div>')+
    '</div></div>'+
  '</div>'+

  '<div class="panel" style="margin-bottom:16px"><div class="panel-head"><h3>Unusual Spending</h3></div><div class="panel-body" style="padding-top:8px">'+

      '<div class="act-row"><button class="btn btn-sm" data-act="drill" data-cat="'+esc(a.cat)+'" data-from="'+monthStart(k)+'" data-to="'+monthEnd(k)+'">Inspect</button><button class="btn btn-sm btn-ghost" data-act="ins-dismiss" data-key="anom:'+esc(a.cat)+':'+k+'">Dismiss for this month</button></div></div></div>';}).join('')+
      txAnoms.map(function(t){return '<div class="insight info"><div class="ii">'+I('info',17)+'</div><div class="tx"><b>Unusually large: '+esc(t.description)+' ('+money(t.amount)+')</b><span>'+esc(t.category)+' \u2014 about '+(medians[t.category]>0?Math.round(t.amount/medians[t.category]):'\u2013')+'\u00d7 the typical purchase in that category. Only a size observation.</span>'+

    return{label:fmtDShort(e.date),value:(fc.balAfter[e.date]!=null?fc.balAfter[e.date]:fc.cash0),color:col,title:fmtDate(e.date)+' \u2014 '+e.label+' ('+signed(e.amt)+')'};});
  const cf=avgNetCashflow(3);
  const sc=ui.scenario;
  const adjNet=(cf!=null?round2(cf*(1+sc.incomePct/100)+((sc.diningCut>0)?(categoryBaseline()['Food & Dining']||0)*sc.diningCut/100:0)-(sc.monthlyAdj||0)):null);
  const savePot=(cf!=null?round2(Math.max(0,(adjNet!=null?adjNet:cf)*ui.fc.horizon)):0);
  const cfNote=(cf!=null
    ?('<p style="font-size:13.5px">Your average net cash flow over the last 3 complete months is <b class="'+(cf>=0?'pos':'neg')+'">'+money(cf)+'/month</b>'+((sc.incomePct||sc.diningCut||sc.monthlyAdj)?(' (with what-if changes: <b>'+money(adjNet)+'</b>)'):'')+', so over '+ui.fc.horizon+' month(s) you could plausibly set aside about <b class="pos">'+money(savePot)+'</b>.</p>')

/* ---------- Debt ---------- */
function payoffEstimate(bal,apr,monthly){
  if(!(monthly>0)||bal<=0)return null;
  const r=apr>0?apr/100/12:0;
  if(r>0){if(monthly<=bal*r)return{ok:false,reason:'Payment does not cover the monthly interest.'};
    const n=Math.log(monthly/(monthly-r*bal))/Math.log(1+r);
    return{ok:true,months:Math.ceil(n),interest:round2(monthly*n-bal)};}
  return{ok:true,months:Math.ceil(bal/monthly),interest:0};
}
RENDER.debt=function(){
  const liabs=state.accounts.filter(function(a){return LIABS.includes(a.type)&&!a.archived;});

  const cur=monthKey(TODAY());
  const trend=[];for(let i=5;i>=0;i--){const k=monthAdd(cur,-i);
    trend.push({k:k,v:(k===cur?debt:round2(liabs.reduce(function(s,a){return s+accountBalance(a.id,monthEnd(k));},0)))});}
  const upcoming=liabs.filter(function(a){return a.dueDay&&accountBalance(a.id)>0;}).map(function(a){
    let d=cur+'-'+String(clamp(a.dueDay,1,dim(cur))).padStart(2,'0');
    if(d<TODAY())d=monthAdd(cur,1)+'-'+String(clamp(a.dueDay,1,dim(monthAdd(cur,1)))).padStart(2,'0');
    return{a:a,d:d};}).sort(function(x,y){return x.d<y.d?-1:1;});
  const liabCards=(liabs.length?liabs.map(function(a){

    const est=payoffEstimate(bal,a.apr,a.plannedPayment||a.minPayment);
    const estTxt=est?(est.ok?(est.months+' months \u00b7 ~'+money(est.interest)+' interest'):('<span class="neg">'+esc(est.reason)+'</span>')):(bal>0?'Set a planned payment':'\u2014');

    '<div style="font-size:12px;color:var(--muted)">'+(bal>0?'outstanding':'fully paid')+' \u00b7 '+ACC_LBL[a.type]+(a.apr?(' \u00b7 APR '+a.apr+'%'):'')+'</div></div>'+
    '<div style="min-width:220px;flex:1">'+
    '<div class="kv"><span class="k">Minimum payment</span><span class="v">'+money(a.minPayment)+(a.dueDay?(' (due day '+a.dueDay+')'):'')+'</span></div>'+
    '<div class="kv"><span class="k">Planned monthly</span><span class="v">'+money(a.plannedPayment)+'</span></div>'+
    '<div class="kv"><span class="k">Payoff estimate</span><span class="v">'+estTxt+'</span></div>'+
    '<div style="color:var(--muted);font-size:11.5px;margin-top:4px">Assumes a fixed monthly payment at the entered APR; your bank\u2019s method may differ.</div>'+
    '</div>'+
    '<div class="split-btns" style="flex-direction:column">'+
    '<button class="btn btn-sm btn-primary" data-act="debt-pay" data-id="'+esc(a.id)+'">'+I('plus',14)+' Record payment</button>'+
    '<button class="btn btn-sm" data-act="acc-hist" data-id="'+esc(a.id)+'">'+I('list',14)+' History</button>'+
    '<button class="btn btn-sm" data-act="acc-edit" data-id="'+esc(a.id)+'">'+I('edit',14)+' Edit</button></div></div>'+
    (pays.length?('<div class="subhead" style="margin-top:12px">Recent payments</div><div class="table-scroll"><table class="tbl"><tbody>'+pays.map(function(p){return '<tr class="rowlink" data-act="txn-view" data-id="'+esc(p.id)+'"><td class="num">'+fmtDate(p.date)+'</td><td>'+esc(p.description)+'</td><td class="amt">'+money(p.amount)+'</td></tr>';}).join('')+'</tbody></table></div>'):'')+

  return debtFreeAndNetIncomeHTML(ui.month)+'<div class="grid g-3" style="margin-top:16px">'+

  const assets=state.accounts.filter(function(a){return ASSETS.includes(a.type);});
  const liabs=state.accounts.filter(function(a){return LIABS.includes(a.type);});
  const cash=availableCash(),debt=totalDebt();
  const cur=monthKey(TODAY());
  const accCard=function(a){

let su=null;

function suParse(raw){
  const s=String(raw==null?'':raw).trim().replace(/[₱,\s]/g,'').replace(/%$/,'');
  if(s==='')return{empty:true,v:0};
  if(!/^-?(\d+\.?\d*|\.\d+)$/.test(s))return{bad:'Numbers only'+(/o/i.test(s)?' — that “O” is a letter, not a zero':''),v:0};
  const v=parseFloat(s);if(v<0)return{bad:'Can’t be negative',v:0};

}
const fmtPct=v=>(Math.round(v*10)/10).toString().replace(/\.0$/,'')+'%';
function draftFrom(plan,fresh){

function suSyncDebtLineRaw(l,inc){
  if(l.group!=='debts')return;
  const t=suParse(l.target),p=suParse(l.paid),m=suParse(l.months);
  const tot=t.bad||t.empty?0:t.v;
  const pd=p.bad||p.empty?0:p.v;
  const mos=Math.max(1,Math.round(m.bad||m.empty?6:m.v));
  const rem=Math.max(0,round2(tot-pd));
  l.mode='amt';
  l.raw=String(round2(rem/mos));
}
function suBalanceNeedsTank(d){
  const ip=suParse(d.income),inc=ip.bad||ip.empty?0:ip.v;
  const sp=suParse(d.split.needs),needsPct=sp.bad||sp.empty?0:sp.v;
  const needsTarget=round2(inc*needsPct/100);
  const debtLines=d.lines.filter(l=>l.group==='debts');
  debtLines.forEach(l=>suSyncDebtLineRaw(l,inc));
  const debtSum=round2(debtLines.reduce((s,l)=>s+(suParse(l.raw).v||0),0));
  const needsLines=d.lines.filter(l=>l.group==='needs');
  if(needsLines.length===1&&needsLines[0].name==='Needs'&&inc>0){
    const remNeeds=Math.max(0,round2(needsTarget-debtSum));
    needsLines[0].mode='amt';
    needsLines[0].raw=String(remNeeds);
  }
}
function suCalc(d){
  const ip=suParse(d.income),inc=ip.bad||ip.empty?0:ip.v;
  const out={inc:inc,incErr:ip.bad||(ip.empty?'Enter your monthly income':(inc<=0?'Must be more than ₱0':'')),split:{},splitErr:{},lines:{},groups:{},debts:{sum:0,pct:0,remTotal:0,count:0},errCount:0};
  let tot=0;
  PLAN_GROUPS.forEach(g=>{const r=suParse(d.split[g]);out.split[g]=r.bad||r.empty?0:r.v;
    out.splitErr[g]=r.bad||(r.empty?'Enter a percent':(r.v>100?'Can’t be more than 100%':''));tot+=out.split[g];});
  out.splitTotal=Math.round(tot*100)/100;
  out.splitOk=!PLAN_GROUPS.some(g=>out.splitErr[g])&&Math.abs(tot-100)<0.001;
  d.lines.filter(l=>l.group==='debts').forEach(l=>suSyncDebtLineRaw(l,inc));
  PLAN_GROUPS.forEach(g=>{
    const target=round2(inc*out.split[g]/100);let sum=0,bad=0;
    const checkLines=g==='needs'?d.lines.filter(l=>l.group==='needs'||l.group==='debts'):d.lines.filter(l=>l.group===g);
    checkLines.forEach(l=>{
      if(l.group==='debts'){
        const rt=suParse(l.target),rp=suParse(l.paid),rm=suParse(l.months);
        const totD=rt.bad||rt.empty?0:rt.v,pdD=rp.bad||rp.empty?0:rp.v,mosD=Math.max(1,Math.round(rm.bad||rm.empty?1:rm.v));
        const remD=Math.max(0,round2(totD-pdD));
        const amt=round2(remD/mosD);
        const pct=inc>0?amt/inc*100:0;
        let err=rt.bad||rp.bad||rm.bad||(totD<=0?'Enter total debt amount':'')||(!String(l.name||'').trim()?'Give this debt a name':'');
        if(!err&&pct>out.split.needs+1e-9)err='Monthly installment ('+money0(amt)+') exceeds your entire Needs share ('+money0(target)+'). Increase payoff months or raise Needs %.';
        if(err)bad++;
        out.lines[l.id]={amt:amt,pct:pct,rem:remD,mos:mosD,err:err};
        out.debts.sum=round2(out.debts.sum+amt);
        out.debts.remTotal=round2(out.debts.remTotal+remD);
        if(remD>0)out.debts.count++;
        sum+=amt;
        return;
      }
      const r=suParse(l.raw);let err=r.bad||(r.empty?'Enter an amount, or remove this line':'');
      const amt=r.bad||r.empty?0:(l.mode==='pct'?round2(inc*r.v/100):r.v);
      const pct=l.mode==='pct'?(r.bad||r.empty?0:r.v):(inc>0?amt/inc*100:0);
      if(!err&&pct>out.split[g]+1e-9)err='A line can’t be more than its group ('+fmtPct(out.split[g])+')';
      if(!err&&!String(l.name||'').trim())err='Give this line a name';
      if(!err&&d.lines.some(x=>x!==l&&x.group!=='savings'&&l.group!=='savings'&&x.name.trim().toLowerCase()===String(l.name).trim().toLowerCase()))err='This name is already used';
      if(err)bad++;
      out.lines[l.id]={amt:amt,pct:pct,err:err};sum+=amt;});
    const diff=round2(sum-target);
    const tol=Math.max(0.5,inc*0.00005);
    out.groups[g]={target:target,sum:round2(sum),diff:diff,bad:bad,state:bad?'bad':diff>tol?'over':diff<-tol?'under':'ok',sumPct:inc>0?sum/inc*100:0};
  });
  out.debts.pct=inc>0?out.debts.sum/inc*100:0;
  out.errCount=(out.incErr?1:0)+PLAN_GROUPS.reduce((s,g)=>s+(out.splitErr[g]?1:0)+out.groups[g].bad,0);
  return out;
}
function suStepValid(c,step){
  if(step===1)return !c.incErr&&(!su.needAcc||String(su.d.acc.name).trim())&&(su.d.payday!=='day'||(+su.d.payDay>=1&&+su.d.payDay<=28));
  if(step===2)return c.splitOk;
  if(step>=3&&step<=5){const g=PLAN_GROUPS[step-3];return c.groups[g].state==='ok';}
  return !c.errCount&&c.splitOk&&PLAN_GROUPS.every(g=>c.groups[g].state==='ok');
}

function fmtMonthYear(m){const d=parseISO(TODAY());const x=new Date(d.getFullYear(),d.getMonth()+m,1);return MONS[x.getMonth()]+' '+x.getFullYear();}
function countTo(sel,to,fmt){
  document.querySelectorAll('#suRoot '+sel).forEach(function(el){
    const from=el.dataset.v===undefined?null:parseFloat(el.dataset.v);el.dataset.v=String(to);
    if(from===null||from===to||!isFinite(from)||reduceMotion()){el.textContent=fmt(to);return;}
    const t0=performance.now(),dur=260;cancelAnimationFrame(el._raf);
    const step=function(now){const k=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-k,3);el.textContent=fmt(from+(to-from)*e);if(k<1)el._raf=requestAnimationFrame(step);};
    el._raf=requestAnimationFrame(step);});
}

function suLine(id){return su.d.lines.find(l=>l.id===id);}
function suRescale(g,newPct){
  if(g==='needs'){suBalanceNeedsTank(su.d);return;}
  const ls=su.d.lines.filter(l=>l.group===g&&l.mode==='pct');const sum=ls.reduce((s,l)=>s+(suParse(l.raw).v||0),0);
  if(!ls.length||!(sum>0))return;
  const fixed=su.d.lines.filter(l=>l.group===g&&l.mode==='amt').reduce((s,l)=>s+(suParse(l.raw).v||0),0);
  const inc=suCalc(su.d).inc;const room=newPct-(inc>0?fixed/inc*100:0);if(room<0)return;
  let acc=0;ls.forEach(function(l,i){let v=Math.round((suParse(l.raw).v||0)/sum*room*10)/10;if(i===ls.length-1)v=Math.round((room-acc)*10)/10;acc+=v;l.raw=String(v);});
  ls.forEach(function(l){const i=document.querySelector('#suRoot [data-su-in="line"][data-id="'+l.id+'"]');if(i)i.value=l.raw;});
}
function suAutoFit(g,quiet){
  const c=suCalc(su.d),inc=c.inc,target=c.groups[g].target;
  const debtSum=g==='needs'?c.debts.sum:0;
  let ls=su.d.lines.filter(l=>l.group===g);
  if(!ls.length){
    const defName=g==='needs'?'Needs':g==='wants'?'Wants':'Emergency Fund';
    ls=[{id:uid('PLN'),group:g,name:defName,mode:'amt',raw:String(Math.max(0,round2(target-debtSum))),rollover:false,target:'',targetDate:'',paid:'0',months:'6',freq:'monthly',icon:g==='needs'?'home':g==='wants'?'bag':'shield',custom:false}];
    su.d.lines.push(ls[0]);
  }
  if(g==='needs'&&ls.length===1){
    const rem=Math.max(0,round2(target-debtSum));
    ls[0].mode='amt';ls[0].raw=String(rem);
    const box=document.querySelector('#suRoot [data-lines="needs"]');if(box)box.innerHTML=suLines('needs');
    if(!quiet){suRefresh();toast('Needs consumption tank fitted around your Debts ('+money0(rem)+').','ok');}
    return;
  }
  const fixed=ls.filter(l=>l.mode==='amt').reduce((s,l)=>s+(suParse(l.raw).v||0),0)+debtSum;
  const pl=ls.filter(l=>l.mode==='pct');
  if(!pl.length&&ls.length){
    const lastL=ls[ls.length-1];
    const others=ls.slice(0,-1).reduce((s,l)=>s+(suParse(l.raw).v||0),0)+debtSum;
    if(others<=target){
      lastL.raw=String(Math.max(0,round2(target-others)));
      const box=document.querySelector('#suRoot [data-lines="'+g+'"]');if(box)box.innerHTML=suLines(g);
      if(!quiet){suRefresh();toast(GROUP_LBL[g]+' now fits exactly.','ok');}
      return;
    }
  }
  if(fixed>target+0.5){if(quiet)return;toast('Your fixed ₱ amounts (and debts) exceed '+GROUP_LBL[g]+'. Increase debt payoff months or lower a fixed amount.','err');return;}
  if(!pl.length){if(quiet)return;toast('Every line is a fixed ₱ amount. Change one to fit, or switch it to %.','err');return;}
  const roomPct=(target-fixed)/(inc||1)*100;const sum=pl.reduce((s,l)=>s+(suParse(l.raw).v||0),0);
  let acc=0;pl.forEach(function(l,i){const base=sum>0?(suParse(l.raw).v||0)/sum:1/pl.length;let v=Math.round(base*roomPct*10)/10;if(i===pl.length-1)v=Math.round((roomPct-acc)*100)/100;acc+=v;l.raw=String(v);});
  if(!quiet){su.touched[g]=true;delete su.auto[g];}su.last[g]=null;
  const box=document.querySelector('#suRoot [data-lines="'+g+'"]');if(box)box.innerHTML=suLines(g);
  if(quiet)return;suRefresh();toast(GROUP_LBL[g]+' now fits exactly.','ok');
}
function suConvert(l,to){
  const inc=suCalc(su.d).inc;const r=suParse(l.raw);if(l.mode===to)return;
  if(!r.bad&&!r.empty&&inc>0){
    if(to==='amt')l.raw=String(Math.round(inc*r.v/100));
    else{   // ₱ -> %: keep as many decimals as needed (up to 4) so the peso amount doesn't move, e.g. ₱25,000 of ₱60,000 = 41.6667%
      const exact=r.v/inc*100;let p=exact;
      for(let k=1;k<=4;k++){const f=Math.pow(10,k);p=Math.round(exact*f)/f;if(Math.abs(inc*p/100-r.v)<0.05)break;}
      l.raw=String(p);
    }
  }
  l.mode=to;
}
function suRedrawLines(g){

/* ---------- apply the plan to the app ---------- */
function applyPlan(d,opts){
  opts=opts||{};
  const num=function(x){const r=suParse(x);return r.bad||r.empty?0:r.v;};
  const oldNames=((state.plan&&state.plan.lines)||[]).filter(l=>l.group!=='savings').map(l=>l.name);
  state.settings.catIcons=state.settings.catIcons||{};
  d.lines.forEach(l=>{const nm=String(l.name||'').trim();if(nm&&l.icon&&ICONS[l.icon])state.settings.catIcons[nm]=l.icon;});
  state.plan=normPlan({income:num(d.income),payday:d.payday,payDay:num(d.payDay)||1,split:{needs:num(d.split.needs),wants:num(d.split.wants),savings:num(d.split.savings)},
    lines:d.lines.map(l=>({id:l.id,group:l.group,name:String(l.name).trim(),mode:l.group==='debts'?'amt':l.mode,pct:l.mode==='pct'&&l.group!=='debts'?num(l.raw):null,amount:l.mode==='amt'||l.group==='debts'?num(l.raw):null,
      rollover:l.rollover,target:num(l.target),targetDate:l.targetDate,paid:num(l.paid),months:Math.max(1,Math.round(num(l.months))||6),freq:l.freq||'monthly',icon:l.icon||''}))});
  prunePaidDebts();
  const p=state.plan;
  if(!state.accounts.length&&String(d.acc.name).trim())
    state.accounts.push({id:uid('ACC'),name:String(d.acc.name).trim(),type:d.acc.type,openingBalance:num(d.acc.bal),openingDate:TODAY(),notes:'',archived:false,apr:null,minPayment:0,dueDay:null,plannedPayment:0});
  state.settings.monthStartDay=p.payday==='15-30'?15:p.payday==='day'?clamp(p.payDay,1,28):1;
  p.lines.filter(l=>l.group!=='savings').forEach(function(l){
    const c=state.settings.expenseCats.find(x=>x.name.toLowerCase()===l.name.toLowerCase());
    if(c){c.essential=l.group==='needs';l.name=c.name;}else state.settings.expenseCats.push({name:l.name,essential:l.group==='needs'});});
  ensureCatIds(state);
  if(state.settings.incomeCats.indexOf('Salary')<0)state.settings.incomeCats.unshift('Salary');
  p.lines.filter(l=>l.group==='savings').forEach(function(l){
    const amt=lineAmt(l,p.income),g=state.goals.find(x=>x.name.toLowerCase()===l.name.toLowerCase());
    if(g){g.monthlyContribution=amt;if(l.target)g.target=l.target;if(l.targetDate)g.targetDate=l.targetDate;}
    else state.goals.push({id:uid('GOL'),name:l.name,target:l.target||0,saved:0,targetDate:l.targetDate||null,monthlyContribution:amt});});
  const newNames=p.lines.filter(l=>l.group!=='savings').map(l=>l.name);
  syncPlanBudgets(monthKey(TODAY()),oldNames.filter(n=>newNames.indexOf(n)<0));
  syncPayBills();
  if(opts.fresh)state.isDemo=false;
  ui.month=monthKey(TODAY());
  closeSetup();
  if(opts.fresh&&typeof Sync!=='undefined'&&Sync.url&&!Sync.snap){initSheet('plan');}
  else refresh();
  nav('dashboard');
  document.body.classList.remove('just-built');void document.body.offsetWidth;document.body.classList.add('just-built');
  setTimeout(function(){document.body.classList.remove('just-built');},1400);
  if(!opts.fresh)toast(opts.edit?'Plan saved. This month’s budgets are updated.':'Your plan is set up. Budgets and goals are ready.','ok');
}
/* Budgets for one budget month, from the plan. Lines removed from the plan lose their budget. */
function syncPlanBudgets(k,removed){
  const p=state.plan;if(!p||!p.income)return 0;let n=0;
  p.lines.filter(l=>l.group!=='savings').forEach(function(l){
    const amt=lineAmt(l,p.income);const b=state.budgets.find(x=>x.month===k&&x.scope==='monthly'&&x.category===l.name);
    if(b){if(b.amount!==amt||!!b.rollover!==!!l.rollover){b.amount=amt;b.rollover=!!l.rollover;n++;}}
    else{state.budgets.push({id:uid('BUD'),month:k,category:l.name,amount:amt,scope:'monthly',rollover:!!l.rollover});n++;}});
  (removed||[]).forEach(function(name){const before=state.budgets.length;
    state.budgets=state.budgets.filter(x=>!(x.month===k&&x.scope==='monthly'&&x.category===name));n+=before-state.budgets.length;});
  return n;
}
/* A new payday month with no budgets yet gets them from the plan. */
function ensurePlanBudgets(){
  if(!hasPlan())return false;const k=monthKey(TODAY());
  if(state.budgets.some(b=>b.month===k&&b.scope==='monthly'&&b.category!=='__total__'))return false;
  return syncPlanBudgets(k,[])>0;
}
function syncPayBills(){
  const p=state.plan;
  state.recurring=state.recurring.filter(r=>String(r.description).slice(-PLAN_MARK.length)!==PLAN_MARK);
  if(!p.income)return;
  if(state.recurring.some(r=>r.type==='income'&&r.status==='active'))return;   // you already track your own pay
  const acc=state.accounts.find(a=>!a.archived&&(a.type==='bank'||a.type==='ewallet'))||state.accounts.find(a=>!a.archived&&ASSETS.includes(a.type));
  if(!acc)return;
  const today=TODAY(),t=parseISO(today);
  const nextOn=function(day){let d=new Date(t.getFullYear(),t.getMonth(),Math.min(day,new Date(t.getFullYear(),t.getMonth()+1,0).getDate()));
    if(isoDate(d)<today){const n=new Date(t.getFullYear(),t.getMonth()+1,1);d=new Date(n.getFullYear(),n.getMonth(),Math.min(day,new Date(n.getFullYear(),n.getMonth()+1,0).getDate()));}return isoDate(d);};
  const mk=function(desc,amt,freq,start){return{id:uid('BIL'),description:desc+PLAN_MARK,type:'income',amount:round2(amt),category:'Salary',account:acc.id,startDate:start,endDate:null,freq:freq,nextDue:start,status:'active'};};
  if(p.payday==='15-30'){state.recurring.push(mk('Pay, 15th',p.income/2,'monthly',nextOn(15)),mk('Pay, 30th',p.income/2,'monthly',nextOn(30)));}
  else if(p.payday==='biweekly')state.recurring.push(mk('Pay',p.income*12/26,'biweekly',today));
  else state.recurring.push(mk('Pay',p.income,'monthly',nextOn(p.payday==='day'?p.payDay:1)));
}

/* ---------- Home & Budgets pieces ---------- */
function planActuals(k){
  const sm=spendFor(k),out={needs:0,wants:0,savings:0};
  for(const c in sm)out[planGroupOf(c)==='needs'?'needs':'wants']+=sm[c];
  const sav=state.accounts.filter(a=>a.type==='savings').map(a=>a.id);
  for(const t of monthTxns(k))if((t.type==='transfer')&&sav.indexOf(t.toAccount)>=0&&sav.indexOf(t.fromAccount)<0)out.savings+=t.amount;
  PLAN_GROUPS.forEach(g=>{out[g]=round2(out[g]);});
  return out;
}

/* ================= ACCOUNTS: sign up, verify email, log in =================
   The server (Code.gs → apiAuth) does the real checks. This file only draws the
   screens, checks typing as you go, and keeps the login key on this phone. */
const ACC_FLAG='badyet_accounts_on',ACC_USER='badyet_user',ACC_LAST='badyet_last_id';
function accFlag(){try{return localStorage.getItem(ACC_FLAG)==='1';}catch(e){return false;}}
function setAccFlag(on){Sync.accountsOn=!!on;try{if(on)localStorage.setItem(ACC_FLAG,'1');else localStorage.removeItem(ACC_FLAG);}catch(e){}}
function savedUser(){try{return JSON.parse(localStorage.getItem(ACC_USER)||'null');}catch(e){return null;}}
function setUser(u){Sync.user=u||null;try{if(u)localStorage.setItem(ACC_USER,JSON.stringify(u));else localStorage.removeItem(ACC_USER);}catch(e){}}
function lastId(){try{return localStorage.getItem(ACC_LAST)||'';}catch(e){return '';}}
function setLastId(v){try{if(v)localStorage.setItem(ACC_LAST,v);}catch(e){}}
/* Flags that arrive with every read */
function noteServerFlags(d){
  if(!d)return;
  if(d.__accountsOn!==undefined)setAccFlag(!!d.__accountsOn);
  if(d.__account){const u=Object.assign({},Sync.user||{},d.__account);if(d.__sheetUrl)u.sheetUrl=d.__sheetUrl;setUser(u);}
  if(d.__accountsUrl!==undefined)Sync.accountsUrl=String(d.__accountsUrl||'');
}
async function authCall(op,payload){const res=await apiRaw({action:'auth',op:op,payload:payload||{}});return res.data||{};}
function authErr(){const e=new Error('Please log in.');e.locked=true;e.auth=true;return e;}
/* Any read/write that comes back "please log in" lands here */
function handleAuth(){
  if(document.getElementById('auRoot'))return;
  Sync.locked=true;setToken('');setAccFlag(true);setUser(null);
  try{localStorage.removeItem(LS_KEY);}catch(e){}dropSnap();
  state=blankState();Sync.snap=null;Sync.remoteSig='';Sync.pending=false;
  if(modalOpen())closeModal();
  render();showAuth('login');
}
async function logOut(){
  try{await authCall('logout');}catch(e){}
  setToken('');setUser(null);
  try{localStorage.removeItem(LS_KEY);}catch(e){}dropSnap();
  state=blankState();Sync.snap=null;Sync.remoteSig='';Sync.pending=false;Sync.locked=true;
  if(modalOpen())closeModal();
  render();showAuth('login',{msg:'You’re logged out.'});
}

const AU_RULES={
  user:function(u){return /^[a-z0-9_]{3,20}$/.test(u)?'':'Use 3 to 20 letters, numbers or _ (no spaces).';},
  email:function(e){return (e.length<=254&&/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e))?'':'That email doesn’t look right.';},
  pass:function(p,u,e){
    const low=String(p||'').toLowerCase(),loc=(e||'').split('@')[0]||'';
    return [{ok:p.length>=8,t:'At least 8 characters'},{ok:/\d/.test(p),t:'Has a number'},
      {ok:!!p&&!(u&&low.indexOf(u)>=0)&&!(loc.length>=4&&low.indexOf(loc)>=0)&&low!==e,t:'Not your username or email'}];

};

function auDraw(focus){
  const el=document.getElementById('auRoot');if(!el)return;

  el.innerHTML='<div class="au-wrap">'+auBody()+'</div>';
  auLive();
  const want=act&&document.getElementById(act)?act:null;
  if(want){const f=document.getElementById(want);f.focus({preventScroll:true});try{const n=f.value.length;f.setSelectionRange(n,n);}catch(e){}}
  else if(focus){const first=el.querySelector('.bad input')||el.querySelector('input:not([type=checkbox])');if(first&&!('ontouchstart' in window))first.focus({preventScroll:true});}
  if(AU.timer){clearInterval(AU.timer);AU.timer=null;}
  if(AU.expAt||AU.resendAt||AU.waitUntil)AU.timer=setInterval(auTick,1000);
}
function auTick(){
  const now=Date.now();
  const set=function(k,t){const n=document.querySelector('[data-au-count="'+k+'"]');if(n)n.textContent=mm((t-now)/1000);};
  if(AU.expAt)set('exp',AU.expAt);
  if(AU.resendAt){if(AU.resendAt<=now){AU.resendAt=0;auDraw();return;}set('resend',AU.resendAt);}
  if(AU.waitUntil){if(AU.waitUntil<=now){AU.waitUntil=0;auDraw();return;}set('wait',AU.waitUntil);}
  if(AU.expAt&&AU.expAt<=now&&AU.screen==='verify'&&!AU.err.code){AU.err.code='That code has expired. Ask for a new one.';auDraw();}
}
/* Live checks while typing, without redrawing the whole screen */
function auLive(){
  const s=AU.screen,v=AU.v;
  const tick=function(k,ok){const box=document.querySelector('#auRoot [data-in="'+k+'"]');if(box)box.classList.toggle('ok',!!ok&&!AU.err[k]);};
  if(s==='signup'||s==='enable'){
    const u=v.username||'',e=(v.email||'').trim().toLowerCase();
    tick('username',u&&!AU_RULES.user(u));tick('email',e&&!AU_RULES.email(e));
    tick('password',AU_RULES.pass(v.password||'',u,e).every(function(r){return r.ok;}));
    const r=document.querySelector('#auRoot [data-rules="password"]');if(r)r.outerHTML=auRules('password',u,e);
    auEnable(auSignupValid());
  }else if(s==='newpass'){
    const ok1=AU_RULES.pass(v.npass||'','',AU.email).every(function(r){return r.ok;});
    tick('npass',ok1);tick('npass2',ok1&&v.npass===v.npass2&&!!v.npass2);
    const r=document.querySelector('#auRoot [data-rules="npass"]');if(r)r.outerHTML=auRules('npass','',AU.email);
    auEnable(ok1&&v.npass===v.npass2);
  }else if(s==='forgot')auEnable(!AU_RULES.email((v.email||'').trim().toLowerCase()));
  else if(s==='verify'){
    const c=String(v.code||''),boxes=document.querySelectorAll('#auRoot .au-code span:not(.au-sr)');
    boxes.forEach(function(b,i){b.textContent=c.charAt(i)||'';b.className=(i<c.length?'f':'')+(i===Math.min(c.length,5)?' cur':'');});
    auEnable(c.length===6);
  }
}

/* ---------- talking to the server ---------- */
async function auRun(fn){
  if(AU.busy)return;
  AU.busy=true;AU.bad='';auDraw();
  try{await fn();}
  catch(e){AU.bad=String(e&&e.message||e).indexOf('NET')===0?'Couldn’t reach Google. Check your internet and try again.':esc(String(e&&e.message||e));}
  finally{AU.busy=false;if(auOpen())auDraw();}
}
function auServerErr(r,fallbackField){
  if(r.field){AU.err[r.field]=esc(r.error)+(r.suggest&&r.suggest.length?' Try <b>'+r.suggest.map(esc).join('</b> or <b>')+'</b>.':'')+(r.emailUsed?' <button type="button" class="au-lnkb" data-au="go" data-to="login">Log in</button> or reset your password.':'');}
  else AU.bad=esc(r.error||'Something went wrong.');
}
function auToVerify(r,purpose,email){
  AU.screen='verify';AU.purpose=purpose;AU.email=email;AU.sentTo=r.sentTo||email;AU.v.code='';AU.err={};AU.bad='';
  AU.expAt=Date.now()+(r.expiresIn||600)*1000;AU.resendAt=Date.now()+(r.resendIn||45)*1000;
}
function auLoggedIn(r){
  setToken(r.token||'');setAccFlag(true);setUser(r.user||null);
  if(r.user)setLastId(r.user.username);
  Sync.locked=false;
}
async function auSubmit(which){
  const v=AU.v;AU.err={};
  if(which==='login')return auRun(async function(){
    const id=String(v.id||'').trim();
    if(!id||!v.password){AU.bad='Enter your username or email and your password.';return;}
    const r=await authCall('login',{id:id,password:v.password,keep:v.keep!==false});
    if(r.ok){auLoggedIn(r);hideAuth();toast('Welcome back, '+(r.user&&r.user.username||'')+'!','ok');firstLoad();return;}
    v.password='';
    if(r.wait){AU.waitUntil=Date.now()+r.wait*1000;return;}
    AU.err.password=esc(r.error||'Wrong username, email or password.')+(r.left!=null&&r.left<=2?' <b>'+r.left+' '+(r.left===1?'try':'tries')+' left</b> before a 5-minute pause.':'');
  });
  if(which==='signup'||which==='enable')return auRun(async function(){
    const p={username:String(v.username||'').trim().toLowerCase(),email:String(v.email||'').trim().toLowerCase(),password:v.password,keep:true};
    const r=await authCall(which==='enable'?'enable':'signup',p);
    if(r.ok){AU.pend=p;auToVerify(r,which==='enable'?'enable':'signup',p.email);return;}
    if(r.wait&&!r.field){AU.bad='Please wait '+r.wait+' seconds before asking for another code.';return;}
    auServerErr(r);
  });
  if(which==='forgot')return auRun(async function(){
    const em=String(v.email||'').trim().toLowerCase();
    const r=await authCall('forgot',{email:em});
    if(r.ok){auToVerify(r,'reset',em);return;}
    auServerErr(r);
  });
  if(which==='verify')return auRun(async function(){
    const code=String(v.code||'');
    if(AU.purpose==='reset'){
      const r=await authCall('reset_check',{email:AU.email,code:code});
      if(r.ok){AU.ticket=r.ticket;AU.screen='newpass';AU.v.npass='';AU.v.npass2='';AU.expAt=0;AU.resendAt=0;return;}
      v.code='';AU.err.code=esc(r.error)+(r.left!=null?' <b>'+r.left+' '+(r.left===1?'try':'tries')+' left</b>, then you’ll need a new code.':'');return;
    }
    const r=AU.purpose==='enable'
      ?await authCall('enable_verify',{username:AU.pend.username,email:AU.email,code:code})
      :await authCall('verify',{email:AU.email,code:code});
    if(r.ok){auLoggedIn(r);AU.screen='ready';AU.user=r.user;AU.shared=r.shared;AU.admin=!!r.admin;AU.expAt=0;AU.resendAt=0;return;}
    if(r.restart){AU.screen='signup';AU.expAt=0;AU.resendAt=0;auServerErr(r);return;}
    v.code='';AU.err.code=esc(r.error)+(r.left!=null?' <b>'+r.left+' '+(r.left===1?'try':'tries')+' left</b>, then you’ll need a new code.':'');
  });
  if(which==='newpass')return auRun(async function(){
    if(v.npass!==v.npass2){AU.err.npass2='The two passwords don’t match.';return;}
    const r=await authCall('reset',{email:AU.email,ticket:AU.ticket,password:v.npass});
    if(r.ok){auLoggedIn(r);hideAuth();toast('Password changed. You’re logged in.','ok');firstLoad();return;}
    if(r.expired){showAuth('forgot',{state:{bad:esc(r.error)}});return;}
    auServerErr(r);
  });
}
async function auResend(){
  return auRun(async function(){
    const r=await authCall('resend',{email:AU.email,purpose:AU.purpose});
    if(r.ok){AU.expAt=Date.now()+(r.expiresIn||600)*1000;AU.resendAt=Date.now()+(r.resendIn||45)*1000;AU.v.code='';AU.err={};toast('New code sent to '+(r.sentTo||'your email')+'.','ok');return;}
    if(r.wait){AU.resendAt=Date.now()+r.wait*1000;return;}
    if(r.expired){showAuth(AU.purpose==='reset'?'forgot':AU.purpose==='enable'?'enable':'signup',{keepValues:true,state:{bad:esc(r.error)}});return;}
    AU.bad=esc(r.error||'Couldn’t send a new code.');
  });
}

/* ---------- events ---------- */
document.addEventListener('input',function(e){
  const t=e.target;if(!t.closest||!t.closest('#auRoot'))return;
  const k=t.dataset&&t.dataset.auIn;if(!k)return;
  let val=t.type==='checkbox'?t.checked:t.value;
  if(k==='username'){const low=String(val).toLowerCase().replace(/\s/g,'');if(low!==val){const pos=t.selectionStart;t.value=low;try{t.setSelectionRange(pos,pos);}catch(x){}}val=low;}
  if(k==='code'){val=String(val).replace(/\D/g,'').slice(0,6);if(val!==t.value)t.value=val;}
  AU.v[k]=val;
  if(AU.err[k]){delete AU.err[k];const box=document.querySelector('#auRoot [data-in="'+k+'"]');if(box)box.classList.remove('bad');const m=document.getElementById('au_'+k+'_m');if(m)m.innerHTML='';t.removeAttribute('aria-invalid');}
  if(k==='code'){if(AU.err.code){delete AU.err.code;const m=document.getElementById('au_code_m');if(m)m.innerHTML='';const c=document.querySelector('#auRoot .au-code');if(c)c.classList.remove('bad');}
    auLive();if(val.length===6&&!AU.busy)auSubmit('verify');return;}
  if(AU.bad){AU.bad='';const tl=document.querySelector('#auRoot .au-tile.bad');if(tl&&AU.screen!=='login')tl.remove();}
  auLive();
});
document.addEventListener('submit',function(e){
  const f=e.target.closest&&e.target.closest('#auRoot [data-au-form]');if(!f)return;
  e.preventDefault();
  const b=f.querySelector('[data-au-go]');if(b&&b.disabled)return;
  auSubmit(f.dataset.auForm==='enable'?'enable':f.dataset.auForm);
});
document.addEventListener('click',function(e){
  const b=e.target.closest&&e.target.closest('#auRoot [data-au]');if(!b)return;
  const a=b.dataset.au;
  if(a==='eye'){const inp=document.getElementById('au_'+b.dataset.k);if(!inp)return;const show=inp.type==='password';inp.type=show?'text':'password';b.innerHTML=AI(show?'eyeoff':'eye',19);b.setAttribute('aria-label',show?'Hide password':'Show password');return;}
  if(a==='theme'){state.settings.theme=b.dataset.v;applyTheme();try{saveState();}catch(x){}auDraw();return;}
  if(a==='go'){showAuth(b.dataset.to,{keepValues:true});return;}
  if(a==='resend'){auResend();return;}
  if(a==='enter'){hideAuth();firstLoad();return;}
  if(a==='back'){
    if(AU.screen==='enable'){hideAuth();Sync.locked=false;return;}
    if(AU.screen==='verify'&&AU.purpose==='enable'){showAuth('enable',{keepValues:true});return;}
    if(AU.screen==='verify'&&AU.purpose==='reset'||AU.screen==='newpass'){showAuth('forgot',{keepValues:true});return;}
    if(AU.screen==='verify'){showAuth('signup',{keepValues:true});return;}
    showAuth('login',{keepValues:true});
  }
});
document.addEventListener('keydown',function(e){
  if(!auOpen())return;
  if(e.key==='Escape'&&AU.screen==='enable'){hideAuth();Sync.locked=false;}
},true);

function openChangePassword(){
  openModal({title:'Change Password',body:
    '<form id="fPw" novalidate><div class="form-err" id="fPwErr"></div>'+
    '<div class="fgrid"><div class="field"><label for="pwCur">Current password</label><input class="inp" id="pwCur" type="password" autocomplete="current-password"></div>'+
    '<div class="field"><label for="pwNew">New password</label><input class="inp" id="pwNew" type="password" autocomplete="new-password"></div>'+
    '<div class="field"><label for="pwNew2">Type it again</label><input class="inp" id="pwNew2" type="password" autocomplete="new-password"></div></div>'+
    '<div class="note">At least 8 characters with a number. Your other phones will be logged out; this one stays in.</div></form>',
    foot:'<button class="btn" data-act="modal-close">Cancel</button><button class="btn btn-primary" id="pwSave">Save Password</button>',
    onMount:function(){
      $('#fPw').addEventListener('submit',function(e){e.preventDefault();$('#pwSave').click();});
      $('#pwSave').addEventListener('click',async function(){
        const cur=$('#pwCur').value,a=$('#pwNew').value,b=$('#pwNew2').value,errEl=$('#fPwErr'),u=Sync.user||{};
        const bad=AU_RULES.pass(a,u.username,u.email).find(function(r){return !r.ok;});
        const msg=!cur?'Enter your current password.':bad?bad.t+' is required.':a!==b?'The two new passwords don’t match.':'';
        if(msg){errEl.textContent=msg;errEl.classList.add('show');return;}
        $('#pwSave').disabled=true;$('#pwSave').textContent='Saving…';
        try{
          const r=await authCall('change_password',{current:cur,password:a});
          if(r.auth){closeModal();handleAuth();return;}
          if(!r.ok)throw new Error(r.error||'Not saved');
          closeModal();toast('Password changed. Other phones were logged out.','ok');
        }catch(e){errEl.textContent=e.message;errEl.classList.add('show');$('#pwSave').disabled=false;$('#pwSave').textContent='Save Password';}
      });
    }});
}
/* ================= FORMS & MODALS ================= */
function accOptions(list,sel){
  return list.map(function(a){return '<option value="'+esc(a.id)+'"'+(a.id===sel?' selected':'')+'>'+esc(a.name)+' ('+ACC_LBL[a.type]+')</option>';}).join('');
}
function openTxnModal(t,pref){
  pref=pref||{};
  const isNew=!t;
  t=t?Object.assign({},t):{date:pref.date||TODAY(),type:pref.type||'expense',description:'',amount:'',category:'',fromAccount:pref.fromAccount||'',toAccount:pref.toAccount||'',method:'',notes:'',tags:[],recurringId:pref.recurringId||null,refundOf:pref.refundOf||null};
  if(pref.category)t.category=pref.category;
  if(pref.description)t.description=pref.description;
  if(pref.amount!==undefined&&pref.amount!=='')t.amount=pref.amount;
  if(!state.accounts.filter(function(a){return !a.archived;}).length){
    openModal({title:'Add an account first',body:'<p style="font-size:14px">Every transaction belongs to an account (for example your bank, cash wallet or GCash). Add one first, then come back.</p>',
      foot:'<button class="btn" data-act="modal-close">Cancel</button><button class="btn btn-primary" data-act="acc-add">'+I('plus',15)+' Add account</button>'});
    return;
  }
  const recentExp=state.transactions.filter(function(x){return x.type==='expense'&&x.date>=addDaysISO(TODAY(),-120);}).slice(-30).reverse();
  const rec=t.recurringId?state.recurring.find(function(r){return r.id===t.recurringId;}):null;
  openModal({title:isNew?(rec?(rec.type==='income'?'Record income received':'Record bill payment'):'Add transaction'):'Edit transaction',body:
  '<form id="fTxn" novalidate><div class="form-err" id="fTxnErr"></div>'+
  (rec&&isNew?'<div class="note teal" style="margin-bottom:12px">Linked to schedule \u201c'+esc(rec.description)+'\u201d. Saving moves its next due date forward.</div>':'')+
  '<div class="fgrid">'+
  '<div class="field"><label>Type</label><select class="inp" id="tType">'+Object.keys(TYPE_LBL).map(function(x){return '<option value="'+x+'"'+(t.type===x?' selected':'')+'>'+TYPE_LBL[x]+'</option>';}).join('')+'</select></div>'+
  '<div class="field"><label>Date</label><input type="date" class="inp" id="tDate" value="'+esc(t.date)+'" required></div>'+
  '</div>'+
  '<div class="field"><label>Description / merchant</label><input class="inp" id="tDesc" value="'+esc(t.description)+'" placeholder="e.g. Puregold, Meralco, Salary" list="descList" autocomplete="off"><datalist id="descList">'+
    Array.from(new Set(state.transactions.slice(-200).map(function(x){return x.description;}))).slice(0,60).map(function(d){return '<option value="'+esc(d)+'">';}).join('')+'</datalist><div class="mem-hint" id="tMem"></div></div>'+
  '<div class="fgrid">'+
  '<div class="field"><label>Amount (\u20b1)</label><input type="number" class="inp" id="tAmt" min="0.01" step="0.01" value="'+esc(t.amount||'')+'" placeholder="0.00" inputmode="decimal"></div>'+
  '<div class="field" id="fCat"><label>Category</label><select class="inp" id="tCat"></select></div>'+
  '</div>'+
  '<div class="fgrid">'+
  '<div class="field" id="fFrom"><label id="lFrom">From account</label><select class="inp" id="tFrom"></select></div>'+
  '<div class="field" id="fTo"><label id="lTo">To account</label><select class="inp" id="tTo"></select></div>'+
  '</div>'+
  '<div id="fRefOf" class="field" style="display:none"><label>Refund of (optional)</label><select class="inp" id="tRefOf"><option value="">\u2014 none \u2014</option>'+recentExp.map(function(x){return '<option value="'+esc(x.id)+'"'+(t.refundOf===x.id?' selected':'')+'>'+esc(fmtDate(x.date)+' \u00b7 '+x.description+' \u00b7 '+money(x.amount))+'</option>';}).join('')+'</select></div>'+
  '<div class="fgrid">'+
  '<div class="field"><label>Payment method (optional)</label><select class="inp" id="tMethod"><option value=""></option>'+['Cash','Debit Card','Credit Card','Bank Transfer','E-Wallet','Autopay','ATM','Other'].map(function(m){return '<option'+(t.method===m?' selected':'')+'>'+m+'</option>';}).join('')+'</select></div>'+
  '<div class="field"><label>Tags (optional, separate with ;)</label><input class="inp" id="tTags" value="'+esc(Array.isArray(t.tags)?t.tags.join('; '):'')+'" placeholder="work; reimbursable"></div>'+
  '</div>'+
  '<div class="field"><label>Notes (optional)</label><textarea class="inp" id="tNotes">'+esc(t.notes||'')+'</textarea></div>'+
  '<div class="note" id="tHelp"></div>'+
  '</form>',
  foot:(isNew?'':'<button class="btn btn-danger" data-act="txn-del" data-id="'+esc(t.id)+'" style="margin-right:auto">'+I('trash',15)+' Delete</button>')+'<button class="btn" data-act="modal-close">Cancel</button><button class="btn btn-primary" id="tSave">'+(isNew?'Add transaction':'Save changes')+'</button>',
  onMount:function(){
    const HELP={income:'Money coming in (salary, freelance\u2026). Counts as income.',expense:'Money going out. Paid with a credit card? Pick the card \u2014 it adds to what you owe.',transfer:'Moving your own money between accounts (e.g. bank \u2192 GCash). Not income or expense.',cc_payment:'Paying off a credit card or loan from a cash account. Reduces debt; not counted as a new expense.',refund:'Money returned to you. Reduces spending in that category.'};
    const draw=function(){
      const type=$('#tType').value;
      const cats=type==='income'?state.settings.incomeCats:state.settings.expenseCats.map(function(c){return c.name;});
      const curCat=$('#tCat').value||t.category;
      $('#tCat').innerHTML=cats.map(function(c){return '<option value="'+esc(c)+'"'+(c===curCat?' selected':'')+'>'+esc(c)+'</option>';}).join('');
      $('#fCat').style.display=(type==='transfer'||type==='cc_payment')?'none':'';
      $('#fRefOf').style.display=type==='refund'?'':'none';
      const live=state.accounts.filter(function(a){return !a.archived||a.id===t.fromAccount||a.id===t.toAccount;});
      const assetL=live.filter(function(a){return ASSETS.includes(a.type);});
      const curFrom=$('#tFrom').value||t.fromAccount,curTo=$('#tTo').value||t.toAccount;
      let fromList='',toList='',lF='From account',lT='To account',showF=true,showT=true;
      if(type==='income'){showF=false;lT='Deposit to';toList=accOptions(assetL,curTo);}
      else if(type==='expense'){lF='Paid with';fromList=accOptions(live.filter(function(a){return ASSETS.includes(a.type)||a.type==='credit';}),curFrom);showT=false;}
      else if(type==='refund'){showF=false;lT='Money returns to';toList=accOptions(live.filter(function(a){return ASSETS.includes(a.type)||a.type==='credit';}),curTo);}
      else if(type==='transfer'){fromList=accOptions(assetL,curFrom);toList=accOptions(live,curTo);}
      else{lF='Pay from (cash account)';fromList=accOptions(assetL,curFrom);lT='Card / loan being paid';toList=accOptions(live.filter(function(a){return LIABS.includes(a.type);}),curTo);}
      $('#fFrom').style.display=showF?'':'none';$('#fTo').style.display=showT?'':'none';
      $('#tFrom').innerHTML='<option value="">\u2014 select \u2014</option>'+fromList;
      $('#tTo').innerHTML='<option value="">\u2014 select \u2014</option>'+toList;
      $('#lFrom').textContent=lF;$('#lTo').textContent=lT;
      $('#tHelp').textContent=HELP[type];
    };
    $('#tType').addEventListener('change',draw);
    draw();
    /* Category memory: same description as before -> same category and account. */
    let catTouched=!isNew,accTouched=!isNew||!!(pref.fromAccount||pref.toAccount);
    $('#tCat').addEventListener('change',function(){catTouched=true;});
    $('#tFrom').addEventListener('change',function(){accTouched=true;});
    $('#tTo').addEventListener('change',function(){accTouched=true;});
    const recall=function(){
      const type=$('#tType').value,m=recallFor($('#tDesc').value,type),hint=$('#tMem');
      if(!m){hint.textContent='';return;}
      const got=[];
      if(!catTouched&&m.category&&Array.from($('#tCat').options).some(function(o){return o.value===m.category;})){$('#tCat').value=m.category;got.push(m.category);}
      const sel=(type==='income'||type==='refund')?$('#tTo'):$('#tFrom');
      if(!accTouched&&m.account&&Array.from(sel.options).some(function(o){return o.value===m.account;})){sel.value=m.account;got.push(acctName(m.account));}
      hint.innerHTML=got.length?I('sparkle',13)+' Remembered: '+esc(got.join(' \u00b7 ')):'';
    };
    $('#tDesc').addEventListener('input',recall);$('#tDesc').addEventListener('change',recall);
    $('#fTxn').addEventListener('submit',function(e){e.preventDefault();$('#tSave').click();});
    $('#tSave').addEventListener('click',function(){
      const type=$('#tType').value,date=$('#tDate').value,desc=$('#tDesc').value.trim();
      const amount=round2(parseFloat($('#tAmt').value));
      const cat=$('#tCat').value||'Other',from=$('#tFrom').value||null,to=$('#tTo').value||null;
      const errs=[];
      if(!/^\d{4}-\d{2}-\d{2}$/.test(date))errs.push('Pick a date.');
      if(!desc)errs.push('Type a description or merchant.');
      if(!isFinite(amount)||amount<=0)errs.push('Amount must be more than zero.');
      if(amount>1e12)errs.push('That amount looks too large.');
      const fa=accountById(from),ta=accountById(to);
      if(type==='income'&&(!ta||!ASSETS.includes(ta.type)))errs.push('Choose which account the money went into.');
      if(type==='expense'&&!fa)errs.push('Choose the account or card used.');
      if(type==='refund'&&!ta)errs.push('Choose the account the money returns to.');
      if(type==='transfer'){
        if(!fa||!ASSETS.includes(fa.type))errs.push('Choose the account the money comes from.');
        if(!ta)errs.push('Choose the account the money goes to.');
        if(from&&from===to)errs.push('From and To must be different accounts.');
      }
      if(type==='cc_payment'){
        if(!fa||!ASSETS.includes(fa.type))errs.push('Choose the cash account you paid from.');
        if(!ta||!LIABS.includes(ta.type))errs.push('Choose the card or loan being paid.');
      }
      const errEl=$('#fTxnErr');
      if(errs.length){errEl.innerHTML=errs.map(esc).join('<br>');errEl.classList.add('show');return;}
      errEl.classList.remove('show');
      const tags=$('#tTags').value.split(';').map(function(x){return x.trim();}).filter(Boolean);
      const recId=t.recurringId||null;
      const obj={id:t.id||uid('TXN'),date:date,type:type,description:desc,amount:amount,
        category:(type==='transfer'||type==='cc_payment')?'':cat,
        fromAccount:(type==='income'||type==='refund')?null:from,
        toAccount:(type==='expense')?null:to,
        method:$('#tMethod').value,notes:$('#tNotes').value.trim(),tags:tags,
        refundOf:(type==='refund'?($('#tRefOf').value||null):null),recurringId:recId};
      mutate(function(){
        if(isNew)state.transactions.push(obj);
        else{const i=state.transactions.findIndex(function(x){return x.id===obj.id;});if(i>=0)state.transactions[i]=obj;else state.transactions.push(obj);}
        if(recId&&isNew){const r=state.recurring.find(function(x){return x.id===recId;});if(r)advanceRecurring(r,obj.date);}
      });

function openReconcileModal(aid){
  const a=accountById(aid);if(!a)return;
  const computed=accountBalance(a.id);
  const liab=isLiab(a);
  openModal({title:'Reconcile \u201c'+esc(a.name)+'\u201d',body:
  '<div class="note" style="margin-bottom:14px">The app calculates '+(liab?'you owe':'a balance of')+' <b>'+money(computed)+'</b>. Type the '+(liab?'amount owed':'balance')+' shown on your statement. Any difference is recorded as a visible \u201cReconciliation\u201d transaction \u2014 history is never silently changed.</div>'+
  '<form id="fRec2" novalidate><div class="form-err" id="fRec2Err"></div>'+
  '<div class="field"><label>Statement '+(liab?'amount owed':'balance')+' (\u20b1)</label><input type="number" class="inp" id="rcBal" step="0.01" value="'+computed+'"></div>'+
  '<div class="field"><label>Statement date</label><input type="date" class="inp" id="rcDate" value="'+TODAY()+'"></div></form>',
  foot:'<button class="btn" data-act="modal-close">Cancel</button><button class="btn btn-primary" id="rcGo">Check & adjust</button>',
  onMount:function(){
    $('#fRec2').addEventListener('submit',function(e){e.preventDefault();$('#rcGo').click();});
    $('#rcGo').addEventListener('click',function(){
      const st=round2(parseFloat($('#rcBal').value));
      const dt=$('#rcDate').value||TODAY();
      if(!isFinite(st)){$('#fRec2Err').textContent='Enter a valid amount.';$('#fRec2Err').classList.add('show');return;}
      const diff=round2(st-computed);
      if(Math.abs(diff)<0.005){closeModal();toast('It matches your statement. Nothing to adjust.','ok');return;}
      const moreMoney=liab?diff<0:diff>0;
      confirmDialog('Record adjustment?','The app says <b>'+money(computed)+'</b> but your statement says <b>'+money(st)+'</b>. Record a '+money(Math.abs(diff))+' adjustment (category: Reconciliation)?','Record adjustment',false,function(){
        mutate(function(){
          state.transactions.push({id:uid('TXN'),date:dt,type:moreMoney?'income':'expense',
            description:'Statement adjustment \u2014 '+a.name,amount:Math.abs(diff),category:moreMoney?'Other Income':'Reconciliation',
            fromAccount:moreMoney?null:a.id,toAccount:moreMoney?a.id:null,method:'',notes:'Reconciliation vs statement',tags:[],recurringId:null,refundOf:null});
        });
        toast('Adjustment of '+money(Math.abs(diff))+' recorded.','ok');
      });
    });
  }});
}

function exportCSVTxns(list,label){

  const head=['id','date','type','description','amount','category','fromAccount','toAccount','method','notes','tags','recurringId'];
  const rows=list.map(function(t){return [t.id,t.date,t.type,t.description,t.amount,t.category,(acctName(t.fromAccount)||''),(acctName(t.toAccount)||''),t.method||'',t.notes||'',t.tags.join(';'),t.recurringId||''].map(csvCell).join(',');});
  download('badyet-transactions-'+(label||TODAY())+'.csv','\uFEFF'+[head.join(',')].concat(rows).join('\n'),'text/csv');
  toast(list.length+' transaction(s) exported to CSV.','ok');
