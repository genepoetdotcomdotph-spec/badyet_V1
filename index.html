<script>
/* Early error reporter — shows a readable message instead of a blank page. */
(function(){
  function show(msg,where){
    try{
      if(!document.body)return;
      var d=document.getElementById('fatalErr');
      if(!d){d=document.createElement('div');d.id='fatalErr';document.body.appendChild(d);}
      d.style.display='block';
      d.innerHTML='<b>Badyet hit an error.</b> '+msg+
        '<small>'+where+' &nbsp;\u00b7&nbsp; If you copied this file by hand, the copy may be incomplete. Details are in the browser console (F12).</small>';
    }catch(e){}
  }
  window.addEventListener('error',function(ev){
    var fn=String(ev.filename||'');
    if(ev.message==='Script error.'||/script\.google|googleusercontent/.test(fn)||(ev.target&&ev.target.tagName==='SCRIPT'))return;
    if(ev.message||ev.error)show(String(ev.message||((ev.error&&ev.error.message)||'Error')),String(ev.filename||'')+(ev.lineno?(' line '+ev.lineno):''));
  },true);
  window.addEventListener('unhandledrejection',function(ev){
    var r=ev.reason;show(String((r&&r.message)||r),'promise');
  });
})();
</script>

<style>
/* ===== badyet — monochrome ===== */
:root{
  --ink:#000; --paper:#fff; --mist:#f3f3f3; --mist2:#ebebeb; --line:#e6e6e6; --muted:#6b6b6b; --muted2:#a3a3a3;
  --glass:rgba(255,255,255,.94); --ink-hover:#2b2b2b; --ring:rgba(0,0,0,.07); --shade:rgba(0,0,0,.38);
  --grid:#f0f0f0; --c2:#bdbdbd; --c3:#7a7a7a; --c4:#d4d4d4;
  --g1:#3d3d3d; --g2:#5f5f5f; --g3:#808080; --g4:#9e9e9e; --g5:#bababa; --g6:#d2d2d2;
  /* older names used by the renderers, all pointing at the theme */
  --navy:var(--ink); --navy2:var(--ink); --navy3:var(--ink); --bg:var(--paper); --card:var(--paper); --soft:var(--mist);
  --teal:var(--ink); --tealbg:var(--mist); --red:var(--ink); --redbg:var(--mist); --orange:var(--ink); --orangebg:var(--mist);
  --r:22px; --shadow:none;
  --font:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --bottom:calc(68px + env(safe-area-inset-bottom,0px));
  --err:#B42318; --errbg:#FEF3F2; --errline:#FECDCA; --errtxt:#7A271A; --g2s:#7a7a7a; --g3s:#c9c9c9;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --ink:#fff; --paper:#000; --mist:#161616; --mist2:#232323; --line:#272727; --muted:#9b9b9b; --muted2:#6e6e6e;
  --glass:rgba(0,0,0,.9); --ink-hover:#d6d6d6; --ring:rgba(255,255,255,.14); --shade:rgba(0,0,0,.7);
  --grid:#1c1c1c; --c2:#5c5c5c; --c3:#8c8c8c; --c4:#383838;
  --g1:#d4d4d4; --g2:#ababab; --g3:#8c8c8c; --g4:#6e6e6e; --g5:#525252; --g6:#383838;
  --err:#F97066; --errbg:#2B1210; --errline:#5C2620; --errtxt:#FDA29B; --g2s:#8a8a8a; --g3s:#454545;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--paper);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;background:none;border:none;color:inherit}
button:disabled{opacity:.4;cursor:not-allowed}
input,select,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:8px}
.ic{vertical-align:-3px;flex:none}
h1,h2,h3,h4{font-weight:700;line-height:1.2;letter-spacing:-.01em}
a{color:var(--ink)}
a.btn{text-decoration:none}
.num,.amt,.vl,.v{font-variant-numeric:tabular-nums}
#fatalErr{display:none;position:fixed;left:12px;right:12px;top:12px;z-index:9999;background:var(--ink);color:var(--paper);padding:12px 16px;border-radius:16px;font:13px/1.5 var(--font)}
#fatalErr small{display:block;opacity:.7;margin-top:6px}

/* ---------- Shell ---------- */
#sidebar{position:fixed;left:0;top:0;bottom:0;width:232px;background:var(--paper);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:60}
#main{margin-left:232px;min-height:100vh;display:flex;flex-direction:column}
body.sb-collapsed #sidebar{width:76px}
body.sb-collapsed #main{margin-left:76px}
body.sb-collapsed .nav-label,body.sb-collapsed #sbFootTxt,body.sb-collapsed #demoChip,body.sb-collapsed #brandTxt{display:none}
body.sb-collapsed .nav-item{justify-content:center}
body.sb-collapsed #sbCollapseIc{transform:rotate(180deg)}
#brand{display:flex;align-items:center;gap:10px;padding:24px 20px 20px}
#brandMark{width:34px;height:34px;flex:none;display:block}
#brandTxt{font-size:25px;font-weight:800;letter-spacing:-.05em;line-height:1}
#navList{flex:1;overflow-y:auto;padding:4px 12px 12px}
.nav-item{display:flex;align-items:center;gap:12px;width:100%;padding:9px 14px;border-radius:999px;color:var(--muted);font-weight:500;text-align:left;margin-bottom:2px}
.nav-item:hover{color:var(--ink);background:var(--mist)}
.nav-item.active{background:var(--ink);color:var(--paper)}
.nav-badge{margin-left:auto;background:var(--ink);color:var(--paper);font-size:12px;font-weight:700;border-radius:99px;padding:0 7px;min-width:20px;text-align:center}
.nav-item.active .nav-badge{background:var(--paper);color:var(--ink)}
#sbCollapse{display:flex;align-items:center;gap:10px;padding:14px 22px;color:var(--muted2);width:100%;text-align:left;font-size:13px}
#sbCollapse:hover{color:var(--ink)}
#sbCollapseIc{display:inline-flex;transition:transform .2s}
#sbFoot{padding:0 22px 18px;font-size:12px;color:var(--muted);line-height:1.45}
#demoChip{display:inline-block;margin-bottom:8px;border:1px solid var(--ink);font-size:12px;font-weight:600;padding:1px 9px;border-radius:99px}
#overlay{display:none}
#burger{display:none}

#topbar{position:sticky;top:0;z-index:40;background:var(--glass);backdrop-filter:saturate(1.2) blur(8px);-webkit-backdrop-filter:blur(8px);padding:14px 32px;display:flex;align-items:center;gap:16px;min-height:72px}
#secTitle{font-size:26px;font-weight:800;letter-spacing:-.04em;line-height:1.1}
#secSub{font-size:13px;color:var(--muted);margin-top:2px}
#tbRight{margin-left:auto;display:flex;align-items:center;gap:10px}
#monthGroup{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:999px;padding:2px 4px}
#monthGroup button{padding:5px 6px;border-radius:99px;color:var(--muted);display:inline-flex}
#monthGroup button:hover{color:var(--ink);background:var(--mist)}
.mlbl{position:relative;display:inline-flex;align-items:center;justify-content:center;min-width:92px;padding:4px 6px;font-weight:600;font-size:14px;cursor:pointer}
#monthPick{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:none}
#monthPick::-webkit-calendar-picker-indicator{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
#btnAddTxn{background:var(--ink);color:var(--paper);border-color:var(--ink)}
#btnPlan{position:relative;gap:7px;padding:8px 15px;font-size:14px}
#btnPlan.new::after{content:'';position:absolute;top:2px;right:2px;width:9px;height:9px;border-radius:99px;background:var(--ink);border:2px solid var(--paper)}
#btnPlan .lbl{white-space:nowrap}
#view{padding:8px 32px 72px;max-width:1180px;width:100%;margin:0 auto}
#bottomNav{display:none}

/* ---------- Sync chip ---------- */
#syncChip{display:inline-flex;align-items:center;gap:8px;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--paper);font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap}
#syncChip:hover{color:var(--ink);border-color:var(--ink)}
#syncChip .dot{width:8px;height:8px;border-radius:99px;border:1.5px solid var(--muted2);flex:none}
#syncChip.ok{color:var(--ink)}
#syncChip.ok .dot{background:var(--ink);border-color:var(--ink)}
#syncChip.saving .dot,#syncChip.connecting .dot{background:var(--muted2);border-color:var(--muted2);animation:pulse 1s infinite}
#syncChip.error{background:var(--ink);color:var(--paper);border-color:var(--ink)}
#syncChip.error .dot{background:var(--paper);border-color:var(--paper)}
#syncChip.off{border-style:dashed;color:var(--ink)}
@keyframes pulse{50%{opacity:.25}}

/* ---------- Buttons, pills, badges ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:var(--paper);font-weight:600;font-size:14px;color:var(--ink);white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--ink)}
.btn-primary,.btn-teal{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn-primary:hover,.btn-teal:hover{background:var(--ink-hover)}
.btn-danger{border-color:var(--ink);background:var(--paper);color:var(--ink)}
.btn-danger:hover{background:var(--ink);color:var(--paper)}
.btn-ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn-ghost:hover{color:var(--ink);border-color:transparent;background:var(--mist)}
.btn,.badge,.seg button{text-transform:capitalize}
.pill,.nav-label,.bn span,#syncTxt,#demoChip,details.more-filters>summary,.tx-sum,.txl-day,.mini .lb,.blk-head h3,.link,
.modal-head h3,.insight .tx b,.hbar-lb,.hbar-sub,.kv .k,.dl dt,.legend,.dl-item .nm,.cat-chip,.hero-sub,.qa-day small,.qa-more,
.kv .v,.sl-row label,#secTitle,#secSub,.week-chip,.panel-head .sub,.choice b,.steps li>b{text-transform:capitalize}
.theme-seg button{display:inline-flex;align-items:center;gap:6px}
.btn-sm{padding:5px 12px;font-size:13px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:99px;color:var(--muted)}
.icon-btn:hover{background:var(--mist);color:var(--ink)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:1px 9px;border-radius:99px;border:1px solid var(--line);background:var(--paper);color:var(--ink);white-space:nowrap}
.b-income,.b-ok{background:var(--mist);border-color:var(--mist)}
.b-transfer,.b-mut{background:var(--mist);border-color:var(--mist);color:var(--muted)}
.b-refund{border-style:dashed}
.b-watch{border-color:var(--ink)}
.b-over{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.cat-chip{font-size:12.5px;background:var(--mist);border-radius:99px;padding:1px 9px;color:var(--ink);font-weight:500;white-space:nowrap}
.tag{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:0 7px;color:var(--muted)}
.pos,.neg,.warnc{color:var(--ink)}

/* ---------- Surfaces ---------- */
.panel{background:var(--paper);border:1px solid var(--line);border-radius:24px}
.panel-head{display:flex;align-items:center;gap:10px;padding:18px 22px 6px;flex-wrap:wrap}
.panel-head h3{font-size:17px;font-weight:700;text-transform:capitalize;letter-spacing:-.02em}
.panel-head .sub{font-size:13px;color:var(--muted)}
.panel-body{padding:12px 22px 20px}
.grid{display:grid;gap:16px;margin-bottom:16px}
.g-2-1{grid-template-columns:2fr 1fr}
.g-1-2{grid-template-columns:1fr 2fr}
.g-3{grid-template-columns:1fr 1fr 1fr}
.g-2{grid-template-columns:1fr 1fr}
.span-2{grid-column:span 2}
.grid>*,.dash>*{min-width:0}
#view{min-width:0}
.subhead{font-size:14px;font-weight:700;margin:6px 0 10px;text-transform:capitalize}
.statrail{display:flex;flex-wrap:wrap;gap:6px 0}
.statrail .stat{padding:4px 20px;border-left:1px solid var(--line);flex:1;min-width:140px}
.statrail .stat:first-child{border-left:none;padding-left:0}
.stat.clickable{cursor:pointer}
.stat .lb{font-size:13px;color:var(--muted);text-transform:capitalize}
.stat .vl{font-size:22px;font-weight:700;letter-spacing:-.03em;margin-top:2px}

/* ---------- Home: hero ---------- */
.dash{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px 40px;align-items:start}
.hero{text-align:center;padding:4px 0 8px}
.hero-pills{display:flex;justify-content:center;gap:6px;margin-bottom:14px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;border:1px solid transparent;font-size:14px;font-weight:500;color:var(--muted)}
.pill:hover{color:var(--ink)}
.pill.on{border-color:var(--ink);color:var(--ink)}
.hero-num{font-size:clamp(44px,8vw,64px);font-weight:800;letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums}
.hero-sub{font-size:14px;color:var(--muted);margin-top:8px}
.hero{margin:0 -32px;padding:4px 32px 8px;overflow:hidden}
.wave{display:block;width:100%;margin-top:14px;height:auto;overflow:visible}
.wave path{transition:d .4s ease}
.months{display:grid;grid-template-columns:repeat(6,1fr);margin-top:6px}
.months button{padding:8px 0;font-size:14px;color:var(--muted2);font-weight:500;text-transform:capitalize}
.months button:hover{color:var(--ink)}
.months button.on{color:var(--ink);font-weight:800}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini{background:var(--mist);border-radius:20px;padding:14px 16px;text-align:left}
.mini:hover{background:var(--mist2)}
.mini .lb{font-size:13px;color:var(--muted)}
.mini .vl{font-size:18px;font-weight:700;letter-spacing:-.03em;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk{margin-top:26px}
.blk-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
.blk-head h3{font-size:17px;font-weight:700;letter-spacing:-.02em}
.link{background:none;border:none;padding:0;cursor:pointer}
.txwrap{padding:0 14px 0 18px}
.blk-head .link{font-size:14px;color:var(--muted)}
.blk-head .link:hover{color:var(--ink)}

/* ---------- Activity list ---------- */
.txl-day{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:16px 0 8px;border-bottom:1px solid var(--line);margin-bottom:4px}
.txl-day:first-child{padding-top:4px}
.txr{display:flex;align-items:center;gap:14px;width:100%;padding:10px 4px;border-radius:16px;text-align:left}
.txr:hover{background:var(--mist)}
.emo{width:42px;height:42px;border-radius:50%;background:var(--mist);color:var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
.hb-ic{display:inline-flex;vertical-align:-3px;margin-right:8px}
.txr-mid{flex:1;min-width:0}
.txr-t,.txr-s{display:block}
.txr-t{font-size:15.5px;font-weight:600;text-transform:capitalize;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25}
.txr-s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txr-a{font-size:15.5px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.txr-a.mv{color:var(--muted);font-weight:500}
.tx-sum{display:flex;gap:18px;flex-wrap:wrap;font-size:13.5px;color:var(--muted);padding:0 22px 6px}
.tx-sum b{color:var(--ink);font-weight:700}

/* ---------- Meters ---------- */
.meter{height:6px;background:var(--mist);border-radius:99px;overflow:hidden;flex:1}
.meter-fill{height:100%;border-radius:99px;background:var(--ink);transition:width .4s ease}
.hbar{padding:9px 0}
.hbar.clickable{cursor:pointer;border-radius:12px}
.hbar.clickable:hover .hbar-lb{text-decoration:underline}
.hbar-top{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-bottom:6px}
.hbar-lb{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar-v{font-weight:700;white-space:nowrap}
.hbar-sub{font-size:12.5px;color:var(--muted);margin-top:5px}

/* ---------- Tables ---------- */
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12.5px;color:var(--muted);font-weight:500;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap;text-transform:capitalize}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:none}
.tbl tbody tr.rowlink{cursor:pointer}
.tbl tbody tr.rowlink:hover{background:var(--mist)}
.tbl .amt{text-align:right;font-weight:700;white-space:nowrap}
.tbl .r{text-align:right}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.empty .ic{color:var(--muted2);margin-bottom:8px}
.pager{display:flex;align-items:center;gap:10px;justify-content:flex-end;padding:12px 22px 18px;font-size:13px;color:var(--muted);flex-wrap:wrap}

/* ---------- Forms ---------- */
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;text-transform:capitalize}
.field .hint{font-size:12px;color:var(--muted);font-weight:400;margin-top:5px}
.inp{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:14px;background:var(--paper);outline:none;font-size:15px}
.inp:focus{border-color:var(--ink);box-shadow:0 0 0 3px var(--ring)}
textarea.inp{resize:vertical;min-height:64px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.form-err{background:var(--paper);border:1.5px solid var(--ink);border-radius:14px;padding:10px 14px;font-size:13.5px;margin-bottom:14px;display:none}
.form-err.show{display:block}
.check{display:flex;align-items:center;gap:8px;font-size:14px}
.check input{width:17px;height:17px;accent-color:var(--ink)}
.filters{display:flex;flex-wrap:wrap;gap:10px;padding:10px 22px 12px;align-items:flex-end}
.filters .field{margin:0;min-width:130px}
.filters .field.grow{flex:1;min-width:200px}
.filters .field.sortf{flex:0 0 128px;min-width:0}
details.more-filters{width:100%}
details.more-filters>summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;padding:6px 14px;border-radius:99px;border:1px solid var(--line)}
details.more-filters>summary::-webkit-details-marker{display:none}
details.more-filters[open]>summary{border-color:var(--ink)}
details.more-filters .filters{padding:12px 0 0}

/* ---------- Charts ---------- */
.chart-wrap{position:relative}
.chart-wrap svg.chart,svg.chart{display:block;width:100%;height:auto}
.ct{font-size:12px;fill:var(--muted2);font-family:var(--font)}
.chart-tip{position:absolute;display:none;background:var(--ink);color:var(--paper);border-radius:12px;padding:7px 11px;font-size:12.5px;pointer-events:none;z-index:5;min-width:120px}
.chart-tip b{display:block;font-size:12px;color:var(--muted2);font-weight:500}
.chart-tip .row{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}
.chart-tip .dot{display:inline-block;width:8px;height:8px;border-radius:99px;margin-right:5px;border:1px solid var(--paper)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted);margin-top:10px}
.legend .li{display:flex;align-items:center;gap:6px}
.legend .sw{width:10px;height:10px;border-radius:99px}
.nochart{padding:28px;text-align:center;color:var(--muted);font-size:14px;background:var(--mist);border-radius:18px}
.donut-row{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.donut-legend{flex:1;min-width:180px}
.dl-item{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:12px;cursor:pointer;font-size:14px}
.dl-item:hover{background:var(--mist)}
.dl-item .sw{width:10px;height:10px;border-radius:99px;flex:none}
.dl-item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dl-item .vv{font-weight:700;font-variant-numeric:tabular-nums}

/* ---------- Alerts ---------- */
.insight{display:flex;gap:12px;padding:14px 16px;border-radius:20px;background:var(--mist);margin-bottom:8px;align-items:flex-start}
.insight.danger{background:var(--paper);border:1.5px solid var(--ink)}
.insight .ii{flex:none;margin-top:1px}
.insight .tx{flex:1;min-width:0}
.insight .tx b{display:block;font-size:14.5px;font-weight:700}
.insight .tx span{font-size:13.5px;color:var(--muted)}
.insight .act-row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.alert-inline{display:flex;gap:10px;align-items:flex-start;background:var(--paper);border:1.5px solid var(--ink);border-radius:18px;padding:12px 14px;font-size:14px;margin-bottom:12px}
.connect-banner{display:flex;gap:14px;align-items:center;flex-wrap:wrap;border:1.5px dashed var(--ink);border-radius:24px;padding:16px 20px;margin-bottom:20px}
.connect-banner .t{flex:1;min-width:220px}
.connect-banner b{display:flex;align-items:center;gap:8px;font-size:15px}
.connect-banner span{font-size:13.5px;color:var(--muted)}
.flash{animation:flash 1s ease}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(0,0,0,.35)}100%{box-shadow:0 0 0 12px rgba(0,0,0,0)}}

/* ---------- Modal / sheet ---------- */
#modalRoot{position:fixed;inset:0;z-index:100;display:none}
#modalRoot.open{display:block}
.modal-backdrop{position:absolute;inset:0;background:var(--shade);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow-y:auto}
.modal{background:var(--paper);border-radius:28px;width:100%;max-width:520px;margin-bottom:40px;animation:pop .22s ease}
@keyframes pop{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.modal-wide{max-width:860px}
.modal-head{display:flex;align-items:center;gap:10px;padding:18px 20px 4px 24px}
.modal-head h3{font-size:19px;font-weight:800;letter-spacing:-.03em;flex:1;display:flex;align-items:center;gap:8px}
.modal-body{padding:12px 24px 18px;max-height:74vh;overflow-y:auto}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:6px 24px 22px;flex-wrap:wrap}
.dl{display:grid;grid-template-columns:130px 1fr;gap:10px 14px;font-size:14.5px}
.dl dt{color:var(--muted)}
.dl dd{font-variant-numeric:tabular-nums;font-weight:500;min-width:0;overflow-wrap:anywhere}

/* ---------- Quick add (keypad) ---------- */
.qa{display:flex;flex-direction:column;align-items:center}
.qa-days{display:flex;gap:6px;justify-content:center;margin:14px 0 6px;width:100%}
.qa-day{width:54px;padding:8px 0;border-radius:16px;display:flex;flex-direction:column;align-items:center;line-height:1.15;color:var(--ink)}
.qa-day b{font-size:17px;font-weight:600}
.qa-day small{font-size:12px;color:var(--muted)}
.qa-day.on{background:var(--ink);color:var(--paper)}
.qa-day.on small{color:var(--muted2)}
.qa-amt{display:flex;align-items:center;gap:6px;margin:18px 0 10px}
.qa-amt .v{font-size:clamp(42px,12vw,54px);font-weight:800;letter-spacing:-.045em;line-height:1}
.qa-amt .v.zero{color:var(--muted2)}
.qa-cats{display:flex;gap:6px;overflow-x:auto;width:100%;padding:4px 2px 8px;scrollbar-width:none;justify-content:flex-start}
.qa-cats::-webkit-scrollbar{display:none}
.qa-cat{flex:none;display:inline-flex;align-items:center;gap:6px;padding:6px 12px 6px 8px;border-radius:999px;background:var(--mist);font-size:13.5px;font-weight:600;text-transform:capitalize;white-space:nowrap}
.qa-cat .e{display:inline-flex}
.qa-cat.on{background:var(--ink);color:var(--paper)}
.qa-row{display:flex;gap:8px;width:100%;margin:4px 0 12px}
.qa-row .inp{border-radius:999px;padding:8px 14px;font-size:14px}
.qa-row select.inp{max-width:46%}
.qa-keys{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 18px;width:100%;max-width:330px;margin-top:4px}
.qa-key{height:62px;border-radius:999px;background:var(--mist);font-size:24px;font-weight:500;display:flex;align-items:center;justify-content:center;transition:transform .08s,background .15s}
.qa-key:active{transform:scale(.94);background:var(--mist2)}
.qa-key.ok{background:var(--ink);color:var(--paper)}
.qa-key.ok:active{background:var(--ink-hover)}
.qa-more{margin-top:14px;font-size:13.5px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.more-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.more-grid button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 6px;border-radius:20px;background:var(--mist);font-size:13.5px;font-weight:600;text-transform:capitalize;position:relative}
.more-grid button.on{background:var(--ink);color:var(--paper)}
.more-grid .dotb{position:absolute;top:10px;right:14px;width:8px;height:8px;border-radius:99px;background:var(--ink)}

/* ---------- Setup wizard ---------- */
.steps{counter-reset:st;list-style:none}
.steps li{position:relative;padding:0 0 20px 44px;font-size:14px}
.steps li::before{counter-increment:st;content:counter(st);position:absolute;left:0;top:-2px;width:30px;height:30px;border-radius:99px;background:var(--ink);color:var(--paper);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.steps li>b{display:block;margin-bottom:3px;font-size:15px}
.steps .muted{color:var(--muted);font-size:13.5px;display:block}
.codebox{background:var(--mist);font:12px/1.55 ui-monospace,Menlo,Consolas,monospace;border-radius:14px;padding:10px 12px;max-height:130px;overflow:auto;white-space:pre;margin-top:8px}
.kbd{display:inline-block;border:1px solid var(--line);border-radius:7px;padding:0 6px;font-size:12.5px;font-weight:600;white-space:nowrap}
.choice{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);border-radius:20px;padding:14px 16px;margin-bottom:10px;background:var(--paper)}
.choice:hover{border-color:var(--ink)}
.choice .ci{width:38px;height:38px;border-radius:99px;background:var(--mist);display:flex;align-items:center;justify-content:center;flex:none}
.choice b{display:block;font-size:15px}
.choice span{font-size:13.5px;color:var(--muted)}

/* ---------- Toast ---------- */
#toastRoot{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:200;display:flex;flex-direction:column;align-items:center;gap:8px;width:max-content;max-width:calc(100vw - 32px)}
.toast{background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-size:14px;display:flex;align-items:center;gap:9px;animation:tin .22s ease}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- Misc ---------- */
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--muted);min-width:0}
.kv .v{font-weight:700;text-align:right}
.seg{display:inline-flex;gap:4px;flex-wrap:wrap}
.seg button{padding:6px 14px;border-radius:999px;font-size:14px;font-weight:500;color:var(--muted);border:1px solid transparent}
.seg button:hover{color:var(--ink)}
.seg button.on{border-color:var(--ink);color:var(--ink)}
.note{background:var(--mist);border-radius:18px;padding:12px 16px;font-size:13.5px;color:var(--muted)}
.note ul{margin:6px 0 0 18px}
.week-chip{font-size:12px;font-weight:600;padding:1px 8px;border-radius:99px;background:var(--mist);color:var(--muted)}
.split-btns{display:flex;gap:8px;flex-wrap:wrap}
.sl-row{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.sl-row label{width:200px;font-size:14px;font-weight:600}
.sl-row input[type=range]{flex:1;min-width:150px}
.sl-row .slv{width:64px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
input[type=range]{accent-color:var(--ink)}
details.expl{border:1px solid var(--line);border-radius:18px;padding:10px 14px;font-size:13.5px;color:var(--muted)}
details.expl summary{cursor:pointer;font-weight:600;color:var(--ink)}
details.expl ol{margin:8px 0 2px 18px}

/* ---------- Tablet & phone ---------- */
@media(max-width:1000px){
  .g-2-1,.g-1-2,.g-3,.g-2,.dash{grid-template-columns:1fr}
  .span-2{grid-column:auto}
}
@media(max-width:900px){
  #sidebar{display:none}
  #main,body.sb-collapsed #main{margin-left:0}
  #topbar{padding:10px 16px;min-height:60px;gap:10px}
  #secTitle{font-size:22px}
  #secSub,#btnAddTxn,#syncTxt{display:none}
  #btnPlan{padding:7px 12px;font-size:13px}
  #syncChip{padding:9px;border-radius:99px}
  .mlbl{min-width:80px;font-size:13.5px}
  #view{padding:4px 16px calc(var(--bottom) + 32px)}
  .hero{margin:0 -16px;padding:4px 16px 8px}
  #bottomNav{display:grid;grid-template-columns:repeat(5,1fr);align-items:center;position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line);height:var(--bottom);padding-bottom:env(safe-area-inset-bottom,0px)}
  .bn{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted2);padding:6px 0;position:relative}
  .bn.on{color:var(--ink)}
  .bn .dotb{position:absolute;top:4px;left:calc(50% + 8px);width:7px;height:7px;border-radius:99px;background:var(--ink)}
  .bn-add{justify-self:center;width:52px;height:52px;border-radius:99px;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center}
  #toastRoot{bottom:calc(var(--bottom) + 14px)}
  .modal-backdrop{align-items:flex-end;padding:0}
  .modal{border-radius:28px 28px 0 0;margin:0;max-width:none;animation:up .26s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom,0px)}
  @keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
  .modal-body{max-height:80vh}
  .statrail .stat{min-width:46%;padding:6px 12px}
  .fgrid{grid-template-columns:1fr}
  .dl{grid-template-columns:110px 1fr}
  .panel{border:none;border-radius:0}
  .grid{gap:8px}
  .panel-head{padding:14px 0 4px}
  .panel-body{padding:8px 0 14px}
  .filters{padding:6px 0 8px;gap:8px}
  .filters .field{min-width:0}
  .filters .field.grow{min-width:0;flex:1 1 150px}
  .tx-sum{padding:0 0 6px}
  .txwrap{padding:0}
  .pager{padding:12px 0 16px}
  .panel-head .btn-primary[data-act=add-txn]{display:none}
  .sl-row label{width:100%}
}
@media(max-width:420px){
  .minis{grid-template-columns:1fr 1fr}
  .minis .mini:last-child{grid-column:span 2}
  .qa-keys{gap:10px 14px}
  .qa-key{height:56px}
  .statrail .stat{min-width:100%;border-left:none;padding:6px 0}
}
@media (prefers-reduced-motion:reduce){*:not(.tank-wave):not(.tank-liquid){animation:none!important;transition:none!important}}

/* ---------- Print ---------- */
#printRoot{display:none}
@media print{
  body>*:not(#printRoot){display:none!important}
  #printRoot{display:block;font-family:var(--font);color:#000;font-size:12px}
  #printRoot h1{font-size:20px} #printRoot h2{font-size:14px;margin:16px 0 6px;border-bottom:1px solid #000;padding-bottom:3px}
  #printRoot table{width:100%;border-collapse:collapse;margin-bottom:8px}
  #printRoot th,#printRoot td{text-align:left;padding:4px 8px;border-bottom:1px solid #ddd}
  #printRoot .r{text-align:right} #printRoot .muted{color:#666}
  #printRoot .foot{margin-top:14px;font-size:10px;color:#666;border-top:1px solid #999;padding-top:6px}
}

/* ---- Safe to spend ---- */
.safe{margin-top:22px;border:1.5px solid var(--ink);border-radius:24px;padding:18px 20px}
.safe-lb{font-size:13px;color:var(--muted);font-weight:500}
.safe-v{font-size:42px;font-weight:800;letter-spacing:-.04em;line-height:1.05;margin-top:4px;font-variant-numeric:tabular-nums}
.safe-v small{font-size:16px;font-weight:600;color:var(--muted);letter-spacing:0}
.safe-sub{font-size:13.5px;color:var(--muted);margin-top:4px}
.safe-how{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.safe-how summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);list-style:none;display:flex;align-items:center;gap:6px}
.safe-how summary::-webkit-details-marker{display:none}
.safe-how summary::after{content:'+';margin-left:auto;font-size:16px}
.safe-how[open] summary::after{content:'\2212'}
.safe-how[open] summary{margin-bottom:8px}
.safe-r{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;padding:3px 0}
.safe-r .num{font-variant-numeric:tabular-nums}
.safe-r.tot{border-top:1px solid var(--line);margin-top:4px;padding-top:7px;font-weight:700}
.hero-per{font-size:12px;color:var(--muted);margin-top:2px}
.carry{font-size:12px;color:var(--muted);font-weight:500;white-space:nowrap}
.mem-hint{font-size:12px;color:var(--muted);min-height:16px;margin-top:4px;display:flex;align-items:center;gap:5px}
.qa .mem-hint{width:100%;max-width:330px;margin-top:-4px}
.qa-row input::-webkit-calendar-picker-indicator{display:none!important}
.pin-txt{font-size:14px;margin:0 0 12px;color:var(--muted)}
.pin-inp{letter-spacing:.3em;font-size:18px}
/* ---- Lock screen ---- */
body.locked{overflow:hidden}
#lockRoot{position:fixed;inset:0;z-index:300;background:var(--paper);display:flex;align-items:center;justify-content:center;
  padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:auto}
.lock-box{display:flex;flex-direction:column;align-items:center;text-align:center;width:100%;max-width:340px}
.lock-mark svg{width:52px;height:52px}
.lock-box h2{font-size:24px;font-weight:800;letter-spacing:-.03em;margin:14px 0 2px}
.lock-sub{color:var(--muted);font-size:14px;margin:0}
.lock-dots{display:flex;gap:14px;margin:26px 0 8px;min-height:14px}
.lock-dots i{width:13px;height:13px;border-radius:50%;border:1.6px solid var(--ink);display:block;transition:background .12s}
.lock-dots i.on{background:var(--ink)}
.lock-err{min-height:20px;font-size:13px;color:var(--muted);margin-bottom:12px}
.lock-keys{margin:0 auto}
.lock-foot{font-size:12px;color:var(--muted);margin-top:22px;max-width:280px}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}

[hidden]{display:none!important}
/* ===== Guided setup & My Plan ===== */
.err-txt{color:var(--err)!important}
body.su-open{overflow:hidden}

#suRoot.su-out{animation:suFadeOut .22s ease-in forwards}

.su-hints{display:flex;gap:8px;flex-wrap:wrap;min-height:2px}

.su-inline{display:flex;align-items:center;gap:10px;font-size:13.5px}.su-inline .inp{width:72px}

.su-ringrow{display:flex;align-items:center;gap:16px}

.su-legend{display:flex;flex-direction:column;gap:7px;flex:1;min-width:0}
.su-legend>div{display:flex;align-items:center;gap:8px;font-size:13.5px}
.su-legend i{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.su-legend span{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted)}
.su-mut{font-size:12px;color:var(--muted)}
.su-bucket{border:1px solid var(--line);border-radius:18px;padding:9px 14px;display:flex;align-items:center;gap:12px}
.su-bucket .dot{width:12px;height:12px;border-radius:4px;flex:none}
.su-bucket .nm{flex:1;min-width:0}.su-bucket .nm b{display:block;font-size:15px}.su-bucket .nm>span{font-size:12.5px;color:var(--muted)}
.su-val{display:flex;flex-direction:column;align-items:flex-end;flex:none}
.su-box{display:flex;align-items:center;gap:2px;border:1.5px solid var(--ink);border-radius:12px;padding:5px 10px;font-weight:700;font-size:15px;min-width:74px;transition:border-color .2s,background .2s,color .2s;cursor:text}
.su-box input{width:58px;border:0;outline:0;background:transparent;color:inherit;font:700 15px var(--font);text-align:right;padding:0;font-variant-numeric:tabular-nums}
.su-box .u{color:inherit;opacity:.75}
.su-box:focus-within{box-shadow:0 0 0 3px var(--ring)}
.peso{font-size:12px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums;white-space:nowrap}
.rowerr{font-size:12px;color:var(--err);display:flex;align-items:flex-start;gap:4px;margin-top:3px;font-weight:600;line-height:1.35}
.rowerr:empty{display:none}.rowerr svg{flex:none;margin-top:1px}
.su-ghead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.su-ghead h3{font-size:18px;font-weight:800;letter-spacing:-.02em}.su-ghead h3 span{font-size:13px;color:var(--muted);font-weight:500;letter-spacing:0}
.grouppill{white-space:nowrap;flex:none;font-size:12px;font-weight:700;border-radius:99px;padding:3px 10px;border:1px solid var(--line);color:var(--muted);transition:background .2s,color .2s}
.grouppill.ok{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.grouppill.bad{color:var(--err);border-color:var(--errline);background:var(--errbg)}
.su-tools{display:block}
.su-unit{margin:6px 0 4px}
.su-unit .cap{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13.5px;font-weight:600;margin-bottom:8px}
.su-unit .cap em{font-style:normal;font-size:12px;font-weight:500;color:var(--muted);text-align:right}
.su-unit.mix .cap em{color:var(--ink);font-weight:600}
.su-unit .tg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--mist);border-radius:22px;padding:4px}
.su-unit .tg button{min-height:58px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--muted);transition:background .24s,color .24s,transform .12s;text-transform:none}
.su-unit .tg button b{font-size:16px;font-weight:700;letter-spacing:-.01em}
.su-unit .tg button small{font-size:12px;font-weight:500;opacity:.85}
.su-unit .tg button.on{background:var(--ink);color:var(--paper)}
.su-unit .tg button:active{transform:scale(.98)}
#suRoot .seg{display:inline-flex;background:var(--mist);border-radius:99px;padding:3px;gap:0;flex-wrap:nowrap}
#suRoot .seg button{padding:6px 13px;border-radius:99px;font-size:13px;font-weight:600;color:var(--muted);border:0;text-transform:none}
#suRoot .seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
:root[data-theme="dark"] #suRoot .seg button.on{background:#333}
.su-line{display:flex;align-items:flex-start;gap:10px;padding:12px 0}
.su-line .emo{width:38px;height:38px;border-radius:99px;background:var(--mist);display:flex;align-items:center;justify-content:center;flex:none;margin-top:2px}
.su-line .mid{flex:1;min-width:0}.su-line .mid b{font-size:14.5px;font-weight:600;display:block}
.su-name{width:100%;border:0;border-bottom:1.5px solid var(--line);background:transparent;color:inherit;font:600 14.5px var(--font);padding:2px 0;outline:0}
.su-name:focus{border-color:var(--ink)}
.sub2{font-size:12px;color:var(--muted);margin-top:1px;min-height:14px}
.su-line .mt{height:4px;border-radius:9px;background:var(--mist2);margin-top:7px;overflow:hidden}
.su-line .mt i{display:block;height:100%;width:0;background:var(--ink);border-radius:9px;transition:width .45s cubic-bezier(.2,.8,.2,1),background .2s}
.su-line .mt i.bad{background:var(--err)}
.su-roll{margin-top:7px;font-size:12px;font-weight:600;border:1px solid var(--line);border-radius:99px;padding:2px 9px;color:var(--muted);display:inline-flex;align-items:center;gap:4px;transition:all .18s}
.su-roll.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.su-goal{display:flex;align-items:center;gap:8px;margin-top:7px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.su-goal label{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:99px;padding:2px 9px}
.su-goal input{width:76px;border:0;outline:0;background:transparent;color:var(--ink);font:600 12px var(--font)}
.su-lact{display:flex;gap:4px;margin-top:5px}
.su-lact button{font-size:12px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:2px 8px;display:inline-flex;align-items:center}
.su-add{margin-top:6px}
.su-enter{animation:suRow .28s cubic-bezier(.2,.8,.2,1)}@keyframes suRow{from{opacity:0;transform:translateY(-6px)}}
.su-leave{transition:opacity .18s,transform .18s;opacity:0;transform:translateX(16px)}
.tip{display:flex;gap:10px;border:1px dashed var(--muted2);border-radius:16px;padding:11px 13px;font-size:12.8px;color:var(--muted);line-height:1.45;margin-top:4px}
.tip b{color:var(--ink)}.tip .ti{width:26px;height:26px;border-radius:99px;background:var(--mist);display:flex;align-items:center;justify-content:center;color:var(--ink);flex:none}
.banner{border-radius:16px;padding:12px 14px;font-size:13px;line-height:1.45;display:flex;flex-direction:column;gap:10px;animation:suRow .25s ease-out}
.banner .bt{display:flex;gap:10px;align-items:flex-start}.banner .bt svg{flex:none;margin-top:1px}
.banner.bad{background:var(--errbg);color:var(--errtxt);border:1px solid var(--errline)}.banner.bad b{color:var(--err)}
.banner.soft{background:var(--mist);color:var(--muted)}.banner.soft b{color:var(--ink)}
.fixes{display:flex;flex-wrap:wrap;gap:6px}
.fix{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:99px;padding:6px 11px;font-size:12.5px;font-weight:600}
.applies{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--muted);background:var(--mist);border-radius:12px;padding:9px 12px;line-height:1.4}.applies b{color:var(--ink)}
.su-split3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex:1;min-width:0}
.su-s3{display:flex;flex-direction:column;gap:4px;align-items:flex-start;font-size:12.5px;min-width:0}
.su-s3>span{display:flex;align-items:center;gap:5px;font-weight:600}.su-s3 i{width:9px;height:9px;border-radius:3px;display:inline-block}
.su-s3 .su-box{min-width:0;width:100%}.su-s3 .su-box input{width:100%}
.su-line .su-box input{width:66px}   /* fits exact conversions like 41.6667 */
.su-gsec{display:flex;flex-direction:column;gap:6px;padding-top:14px;margin-top:4px;border-top:1px solid var(--line)}
.su-fitrow{display:flex;justify-content:flex-end}
.su-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.su-stats>div{background:var(--mist);border-radius:16px;padding:10px 12px;font-size:12px;color:var(--muted)}.su-stats b{display:block;color:var(--ink);font-size:20px;letter-spacing:-.02em}
.su-checks{display:flex;flex-direction:column;gap:10px}
.chk{display:flex;gap:10px;font-size:14px;line-height:1.4;align-items:flex-start}
.chk .c{width:22px;height:22px;border-radius:99px;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;flex:none}
.su-ft{padding:12px 20px calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px;background:var(--paper)}
.su-ft .alloc{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;font-weight:600;align-items:center}
.su-ft .alloc>span:last-child{color:var(--muted);font-weight:500;white-space:nowrap}
.su-ft .alloc .ok,.su-ft .alloc .bad{display:inline-flex;align-items:center;gap:6px}.su-ft .alloc .bad{color:var(--err);font-weight:700}
.su-ft .meter{flex:none;height:8px;border-radius:99px;background:var(--mist2);position:relative;overflow:visible}
.su-ft .meter i{display:block;height:100%;background:var(--ink);border-radius:99px;transition:width .45s cubic-bezier(.2,.8,.2,1)}
.su-ft .meter em{position:absolute;top:0;bottom:0;right:-2px;width:9%;border-radius:0 99px 99px 0;background:repeating-linear-gradient(45deg,var(--err) 0 5px,var(--paper) 5px 8px)}
.su-ft .btns{display:flex;gap:10px}
.su-ft .btn{flex:1;height:52px;font-size:16px;border-radius:99px}
.su-ft .btn[disabled]{background:var(--mist2);color:var(--muted2);border-color:var(--mist2);cursor:not-allowed}
.su-ghost{background:var(--paper);border:1px solid var(--line)}
.su-done{width:52px!important;flex:none!important;margin-left:auto;transition:width .25s}
.shake{animation:shake .32s}
/* tap feedback everywhere */
.btn,.chip,.pill,.pre,.fix,.qa-key,.qa-cat,.tsw button,.bn,.mini,.su-roll{transition:transform .12s ease,background .18s,color .18s,border-color .18s}
.btn:active,.chip:active,.pill:active,.pre:active,.fix:active,.tsw button:active,.su-roll:active,.mini:active{transform:scale(.97)}
/* ===== Plan on Home & Budgets ===== */
.plan-card{margin-top:22px;border:1.5px solid var(--ink);border-radius:24px;padding:16px 18px}
.pc-head{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-weight:500}
.pc-stack{display:flex;height:8px;gap:3px;border-radius:99px;overflow:hidden;margin:12px 0 4px}.pc-stack i{display:block;height:100%}
.pg{display:flex;flex-direction:column;gap:6px;padding:9px 0}
.pg-t{display:flex;justify-content:space-between;font-size:14.5px;gap:8px}.pg-t .mut{color:var(--muted)}.pg-t .num{font-variant-numeric:tabular-nums}
.pg-bar{height:10px;border-radius:99px;background:var(--mist2);position:relative}
.pg-bar i{display:block;height:100%;border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.pg-bar u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:2px}
.pg-s{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);gap:8px}.pg-s b{color:var(--ink)}
.pc-key{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:2px}.pc-key span{width:2px;height:12px;background:var(--ink);display:inline-block}
.pc-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.pc-tiles div{background:var(--mist);border-radius:16px;padding:10px 12px;font-size:12px;color:var(--muted)}.pc-tiles b{display:block;color:var(--ink);font-size:16px;margin-top:2px}
.plan-invite{margin-top:22px;border:1px dashed var(--muted2);border-radius:24px;padding:16px;display:flex;gap:14px;align-items:center}
.pi-ill{flex:none;color:var(--ink)}.pi-t{display:flex;flex-direction:column;gap:4px}.pi-t b{font-size:16px}.pi-t>span{font-size:13px;color:var(--muted);line-height:1.4}.pi-b{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.plan-cta{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}.plan-cta b{display:block;font-size:16px}.plan-cta span{font-size:13px;color:var(--muted)}
.pb-sec{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 4px}.pb-sec:first-child{margin-top:0}
.pb-sec h4{font-size:17px;font-weight:800;letter-spacing:-.02em}.pb-sec span{font-size:13px;color:var(--muted)}
.pb-row{display:flex;align-items:center;gap:12px;width:100%;padding:9px 0;border-bottom:1px solid var(--line);text-align:left;color:var(--ink)}
.pb-row .emo{width:34px;height:34px;border-radius:99px;background:var(--mist);display:flex;align-items:center;justify-content:center;flex:none}
.pb-mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}.pb-n{font-size:14px;font-weight:600}
.pb-bar{height:4px;border-radius:9px;background:var(--mist2);overflow:hidden}.pb-bar i{display:block;height:100%;background:var(--ink);border-radius:9px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.pb-r{text-align:right;font-size:13.5px;display:flex;flex-direction:column;font-variant-numeric:tabular-nums}.pb-r span{font-size:12px;color:var(--muted)}
/* the moment after "Create My Budget": Home builds in, card by card */
body.just-built #view .hero,body.just-built #view .plan-card,body.just-built #view .safe,body.just-built #view .blk,body.just-built #view .minis{animation:build .5s cubic-bezier(.2,.8,.2,1) both}
body.just-built #view .plan-card{animation-delay:.06s}body.just-built #view .safe{animation-delay:.12s}body.just-built #view .minis{animation-delay:.18s}body.just-built #view .blk{animation-delay:.24s}
@keyframes build{from{opacity:0;transform:translateY(14px)}}
@media (max-width:600px){#btnPlan{width:36px;height:36px;padding:0;justify-content:center}#btnPlan .lbl{display:none}}
@media (max-width:420px){.su-h{font-size:25px}.su-big input{font-size:34px}.su-split3{gap:6px}}

/* audit: bigger invisible tap area on small controls */
.su-roll,.su-lact button,.link,.chip.sm,.fix,.tsw button{position:relative}
.su-roll::before,.su-lact button::before,.link::before,.fix::before,.tsw button::before{content:"";position:absolute;left:-2px;right:-2px;top:50%;height:48px;transform:translateY(-50%)}
label.su-box{position:relative}label.su-box::before{content:"";position:absolute;left:0;right:0;top:50%;height:48px;transform:translateY(-50%)}label.su-box>*{position:relative}
.su-lact{gap:8px}

/* ===== Minimalist 4 Tanks, Debt Widgets, Icon Picker & Debt-Free Congratulations ===== */
.tanks-sec{margin-top:20px}
.tanks-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.tanks-head h3{font-size:16px;font-weight:800;letter-spacing:-.02em}
.tanks-head span{font-size:12.5px;color:var(--muted)}
.tanks-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tank-card{display:flex;flex-direction:column;justify-content:space-between;border:1.5px solid var(--line);border-radius:20px;padding:11px 10px;background:var(--paper);text-align:left;position:relative;overflow:hidden;transition:border-color .18s,transform .12s,box-shadow .18s;cursor:pointer}
.tank-card:hover{border-color:var(--ink);box-shadow:0 4px 16px var(--ring)}
.tank-card:active{transform:scale(.98)}
.tank-top{display:flex;align-items:center;justify-content:space-between;gap:4px;margin-bottom:8px;z-index:2;white-space:nowrap}
.tank-title{display:inline-flex;align-items:center;gap:5px;font-weight:800;font-size:13.5px;letter-spacing:-.02em;min-width:0;overflow:hidden;text-overflow:ellipsis}
.tank-pct{font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:99px;background:var(--mist);color:var(--ink);font-variant-numeric:tabular-nums;flex:none}
.tank-vessel{position:relative;height:126px;border:1.5px solid var(--ink);border-radius:18px;background:var(--mist);overflow:hidden;margin-bottom:10px;display:flex;flex-direction:column;justify-content:flex-end;transform:translateZ(0)}
.tank-liquid{width:100%;background:var(--ink);transition:height .65s cubic-bezier(.2,.8,.2,1);position:relative;min-height:0;animation:tankBob 3.2s ease-in-out infinite}
.tank-card:nth-child(2) .tank-liquid{animation-delay:-.8s}
.tank-card:nth-child(3) .tank-liquid{animation-delay:-1.6s}
.tank-card:nth-child(4) .tank-liquid{animation-delay:-2.4s}
.tank-liquid.warn{background:var(--g2)}
.tank-liquid.debt-fill{background:var(--g1)}
.tank-liquid.sav-fill{background:var(--ink)}
.tank-wave{position:absolute;left:0;top:-20px;width:200%;height:24px;pointer-events:none;fill:var(--ink)}
.tank-liquid.warn .tank-wave{fill:var(--g2)}
.tank-liquid.debt-fill .tank-wave{fill:var(--g1)}
.tank-wave.front{animation:tankWaveMove 2.4s linear infinite}
.tank-wave.back{top:-24px;opacity:.42;animation:tankWaveMoveRev 3.6s linear infinite}
.tank-card:hover .tank-wave.front{animation-duration:1.4s}
.tank-card:hover .tank-wave.back{animation-duration:2.1s}
@keyframes tankWaveMove{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
@keyframes tankWaveMoveRev{0%{transform:translateX(-50%)}100%{transform:translateX(0)}}
@keyframes tankBob{0%,100%{transform:translateY(0)}50%{transform:translateY(2.5px)}}
.tank-vessel-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;text-align:center;z-index:2;pointer-events:none;mix-blend-mode:difference;color:#fff}
.tank-vessel-overlay b{font-size:18px;font-weight:800;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}
.tank-vessel-overlay small{font-size:11px;opacity:.88;margin-top:2px}
.tank-sub{font-size:11.5px;color:var(--muted);line-height:1.3;margin-bottom:8px;z-index:2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tank-subcats{display:flex;gap:4px;margin-bottom:8px;z-index:2;overflow:hidden;white-space:nowrap}
.tank-subcat{font-size:10.5px;background:var(--mist);border-radius:99px;padding:1px 6px;color:var(--ink);font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tank-act{display:inline-flex;align-items:center;justify-content:center;gap:4px;width:100%;padding:7px 8px;border-radius:99px;background:var(--ink);color:var(--paper);font-size:12px;font-weight:700;line-height:1.15;white-space:nowrap;text-align:center;z-index:2}
.tank-card.debt-free .tank-act{background:var(--mist);color:var(--ink);border:1px solid var(--line)}
.su-subtabs{display:flex;gap:6px;background:var(--mist);padding:4px;border-radius:99px;margin:4px 0 8px}
.su-subtab{flex:1;padding:8px 12px;border-radius:99px;font-size:13.5px;font-weight:700;color:var(--muted);text-align:center;display:flex;align-items:center;justify-content:center;gap:6px}
.su-subtab.on{background:var(--ink);color:var(--paper)}
.su-subtab .cnt{font-size:11px;padding:1px 6px;border-radius:99px;background:var(--paper);color:var(--ink)}
.su-subtab:not(.on) .cnt{background:var(--mist2);color:var(--ink)}
.su-debt-card{border:1.5px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:10px;background:var(--paper);display:flex;flex-direction:column;gap:8px}
.su-debt-top{display:flex;align-items:center;gap:8px;justify-content:space-between}
.su-debt-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.su-debt-field{display:flex;flex-direction:column;gap:3px}
.su-debt-field label{font-size:11.5px;color:var(--muted);font-weight:600}
.su-debt-summary{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:6px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.su-debt-summary b{color:var(--ink);font-size:13.5px}
.debt-widgets{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;margin-top:20px}
.df-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;border:1px solid var(--ink)}
.df-badge.free{background:var(--ink);color:var(--paper)}
.net-bar{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--mist2);margin:10px 0 6px;gap:2px}
.net-bar i{display:block;height:100%;transition:width .4s ease}
.qa-tanks{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%;margin-bottom:8px}
.qa-tank-btn{padding:8px 4px;border-radius:14px;border:1px solid var(--line);background:var(--mist);font-size:12.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink)}
.qa-tank-btn.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.qa-tank-btn small{font-size:10.5px;opacity:.75;font-weight:500}
/* Plan Icon Picker */
.su-icon-btn{position:relative;cursor:pointer;border:1.5px dashed var(--line);transition:border-color .15s,transform .12s}
.su-icon-btn:hover{border-color:var(--ink);transform:scale(1.05)}
.su-icon-btn::after{content:'✎';position:absolute;right:-3px;bottom:-3px;width:15px;height:15px;border-radius:99px;background:var(--ink);color:var(--paper);font-size:9px;display:flex;align-items:center;justify-content:center;line-height:1}
.su-icon-tray{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;background:var(--mist);border:1px solid var(--line);border-radius:16px;padding:10px;margin:6px 0 8px}
.su-icon-opt{height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--paper);border:1px solid var(--line);color:var(--ink);transition:transform .1s,background .15s}
.su-icon-opt:hover{border-color:var(--ink);transform:scale(1.06)}
.su-icon-opt.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
/* Clickable Activity Header & Inline Search on Home */
.act-head-btn{display:inline-flex;align-items:center;gap:8px;font-size:17px;font-weight:800;letter-spacing:-.02em;cursor:pointer;padding:4px 10px 4px 0;border-radius:10px}
.act-head-btn:hover{opacity:.8}
.home-act-panel{background:var(--paper);border:1.5px solid var(--line);border-radius:22px;padding:14px 16px;margin-top:8px}
.home-act-panel .filters{padding:6px 0 10px}
.home-act-panel .tx-sum{padding:0 0 8px}
.home-act-panel .txwrap{padding:0}
.home-act-panel .pager{padding:10px 0 4px}
/* Debt-Free Congratulations Banner & Modal */
.congrats-card{border:2px solid var(--ink);border-radius:22px;padding:18px 20px;background:var(--paper);display:flex;align-items:center;gap:16px;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px;animation:pop .28s ease}
.congrats-badge{width:48px;height:48px;border-radius:99px;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;flex:none}
.congrats-body{flex:1;min-width:200px}
.congrats-body h4{font-size:17px;font-weight:800;letter-spacing:-.02em;margin-bottom:2px}
.congrats-body p{font-size:13px;color:var(--muted);line-height:1.45}
.congrats-modal-hero{text-align:center;padding:10px 6px 14px}
.congrats-modal-ring{width:76px;height:76px;border-radius:99px;background:var(--ink);color:var(--paper);display:inline-flex;align-items:center;justify-content:center;margin-bottom:12px;box-shadow:0 0 0 8px var(--mist)}
.congrats-modal-hero h2{font-size:24px;font-weight:800;letter-spacing:-.03em;margin-bottom:6px}
.congrats-modal-hero p{font-size:14px;color:var(--muted);max-width:380px;margin:0 auto 14px}
.congrats-stat-box{background:var(--mist);border-radius:18px;padding:12px 16px;text-align:left;margin-top:8px}
@media(max-width:900px){
  .tanks-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .debt-widgets{grid-template-columns:1fr}
  .su-debt-grid{grid-template-columns:1fr 1fr}
  .su-icon-tray{grid-template-columns:repeat(6,1fr)}
}


/* ================= Accounts: sign up / log in ================= */
#auRoot{position:fixed;inset:0;z-index:600;background:var(--paper);color:var(--ink);overflow-y:auto;-webkit-overflow-scrolling:touch;animation:auIn .22s ease-out}
body.au-on{overflow:hidden}
@keyframes auIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#auRoot .au-wrap{max-width:440px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
#auRoot .au-tb{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 0;min-height:58px}
#auRoot .au-cb{width:44px;height:44px;border-radius:99px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink);background:var(--paper)}
#auRoot .au-tsw{display:flex;gap:2px;background:var(--mist);border-radius:99px;padding:3px}
#auRoot .au-tsw button{width:36px;height:34px;border-radius:99px;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:background .2s,color .2s}
#auRoot .au-tsw button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
#auRoot .au-bd{flex:1;padding:8px 24px 28px;display:flex;flex-direction:column}
#auRoot .au-mk{width:58px;height:58px;border-radius:18px;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;margin:18px 0 22px}
#auRoot .au-mk svg{width:30px;height:30px}
#auRoot .au-ey{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
#auRoot h1{font-size:31px;font-weight:900;letter-spacing:-.035em;line-height:1.05;margin:6px 0 8px}
#auRoot .au-sub{color:var(--muted);font-size:15px;line-height:1.5;margin:0 0 20px}
#auRoot .au-sub b{color:var(--ink)}
#auRoot .au-fl{display:flex;flex-direction:column;gap:7px;margin-bottom:15px}
#auRoot .au-fl>label{font-size:13px;font-weight:700}
#auRoot .au-in{display:flex;align-items:center;gap:10px;min-height:54px;border:1.5px solid var(--line);border-radius:16px;padding:0 8px 0 14px;transition:border-color .2s,box-shadow .2s,background .2s}
#auRoot .au-in>.ic{color:var(--muted);flex:none}
#auRoot .au-in input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font:600 16px var(--font);height:50px;padding:0}
#auRoot .au-in input::placeholder{color:var(--muted);font-weight:500}
#auRoot .au-in:focus-within{border-color:var(--ink);box-shadow:0 0 0 3px var(--mist2)}
#auRoot .au-in.bad{border-color:var(--err);background:var(--errbg)}
#auRoot .au-tick{display:none;flex:none;width:22px;height:22px;border-radius:99px;background:var(--ink);color:var(--paper);align-items:center;justify-content:center;margin-right:4px}
#auRoot .au-in.ok .au-tick{display:flex}
#auRoot .au-eye{flex:none;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
#auRoot .au-eye:hover{color:var(--ink)}
#auRoot .au-er{display:flex;gap:6px;align-items:flex-start;color:var(--err);font-size:13px;font-weight:600;line-height:1.4}
#auRoot .au-er .ic{flex:none;margin-top:1px}
#auRoot .au-hint{font-size:12.5px;color:var(--muted)}
#auRoot .au-rules{display:grid;gap:6px;margin:-4px 0 14px}
#auRoot .au-rules div{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);transition:color .2s}
#auRoot .au-rules i{width:18px;height:18px;border-radius:99px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none;transition:background .2s,border-color .2s}
#auRoot .au-rules .y{color:var(--ink);font-weight:600}
#auRoot .au-rules .y i{background:var(--ink);border-color:var(--ink);color:var(--paper)}
#auRoot .au-b1{min-height:56px;border-radius:99px;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;gap:10px;font-weight:800;font-size:16.5px;margin-top:6px;width:100%;transition:opacity .2s,transform .12s}
#auRoot .au-b1:active{transform:scale(.98)}
#auRoot .au-b1.dis,#auRoot .au-b1:disabled{opacity:.35;cursor:not-allowed}
#auRoot .au-b2{min-height:52px;border-radius:99px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:15px;margin-top:10px;color:var(--ink);text-decoration:none}
#auRoot .au-lnk{text-align:center;font-size:14.5px;color:var(--muted);margin:16px 0 0}
#auRoot .au-lnkb{font:inherit;font-weight:700;color:var(--ink);text-decoration:underline;text-underline-offset:3px;padding:10px 2px;margin:-10px 0}
#auRoot .au-row{display:flex;justify-content:space-between;align-items:center;margin:-4px 0 12px;font-size:14px;gap:10px}
#auRoot .au-chk{display:flex;gap:8px;align-items:center;color:var(--muted);cursor:pointer;min-height:44px;position:relative}
#auRoot .au-chk input{position:absolute;opacity:0;width:20px;height:20px;margin:0}
#auRoot .au-chk i{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);color:transparent;display:flex;align-items:center;justify-content:center}
#auRoot .au-chk input:checked+i{background:var(--ink);border-color:var(--ink);color:var(--paper)}
#auRoot .au-chk input:focus-visible+i{outline:2px solid var(--ink);outline-offset:2px}
#auRoot .au-code{position:relative;display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:4px 0 12px;cursor:text}
#auRoot .au-code input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;border:0;padding:0;z-index:1}
#auRoot .au-code span:not(.au-sr){height:62px;border-radius:16px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;transition:border-color .15s}
#auRoot .au-code span.f{border-color:var(--ink)}
#auRoot .au-code:focus-within span.cur{border-color:var(--ink);box-shadow:0 0 0 3px var(--mist2)}
#auRoot .au-code:focus-within span.cur:empty::after{content:"";width:2px;height:28px;background:var(--ink);animation:auBlink 1s steps(1) infinite}
@keyframes auBlink{50%{opacity:0}}
#auRoot .au-code.bad span:not(.au-sr){border-color:var(--err);background:var(--errbg);color:var(--err)}
#auRoot .au-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#auRoot .au-tile{background:var(--mist);border-radius:18px;padding:14px 16px;font-size:14px;line-height:1.5;color:var(--muted);display:flex;gap:10px;margin:2px 0 14px}
#auRoot .au-tile b{color:var(--ink)}
#auRoot .au-tile>.ic{flex:none;color:var(--ink);margin-top:2px}
#auRoot .au-tile.bad{background:var(--errbg);color:var(--err)}
#auRoot .au-tile.bad b,#auRoot .au-tile.bad>.ic{color:var(--err)}
#auRoot .au-meta{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;color:var(--muted);margin:2px 0 16px;min-height:44px}
#auRoot .au-meta b{color:var(--ink)}
#auRoot .au-big{width:92px;height:92px;border-radius:99px;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;margin:26px auto 18px;animation:auPop .4s cubic-bezier(.3,1.5,.5,1)}
@keyframes auPop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
#auRoot .au-center{text-align:center}
#auRoot .au-card{border:1.5px solid var(--line);border-radius:20px;padding:4px 16px;margin:6px 0 16px}
#auRoot .au-card .li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;font-size:14.5px;border-bottom:1px solid var(--line)}
#auRoot .au-card .li:last-child{border-bottom:0}
#auRoot .au-card .li span{color:var(--muted)}
#auRoot .au-card .li b{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end;text-align:right;min-width:0;word-break:break-all}
#auRoot .au-pill{font-size:11.5px;font-weight:700;border-radius:99px;padding:3px 9px;background:var(--ink);color:var(--paper)!important}
#auRoot .au-grow{flex:1;min-height:12px}
#auRoot .au-spin{width:16px;height:16px;border-radius:99px;border:2px solid currentColor;border-right-color:transparent;animation:auSpin .7s linear infinite}
@keyframes auSpin{to{transform:rotate(360deg)}}
.acc-li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.acc-li span{color:var(--muted)}.acc-li b{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end;min-width:0;word-break:break-all}
.badge.acc-admin{background:var(--ink);color:var(--paper)}
@media (prefers-reduced-motion:reduce){#auRoot,#auRoot .au-big{animation:none}#auRoot .au-code span.cur::after{animation:none}}
</style>

/* ================= Web app entry points ================= */
function doGet(e) {
  var p = (e && e.parameter) || {};
  if (!p.action && !p.callback) {   // no parameters: serve the app itself
    var page = HtmlService.createHtmlOutputFromFile('Index')
      .setTitle('badyet')
      .addMetaTag('viewport', 'width=device-width, initial-scale=1, viewport-fit=cover')
      .addMetaTag('mobile-web-app-capable', 'yes')
      .addMetaTag('apple-mobile-web-app-capable', 'yes')
      .setXFrameOptionsMode(HtmlService.XFrameOptionsMode.ALLOWALL);
    if (FAVICON_URL) { try { page.setFaviconUrl(FAVICON_URL); } catch (x) {} }
    return page;
  }
  var cb = (p.callback && /^[A-Za-z_$][\w$.]{0,80}$/.test(p.callback)) ? p.callback : null;
  var res;
  try {
    var data = p.action === 'unlock' ? apiUnlock(p.pin)
             : p.action === 'setpin' ? apiSetPin(p.token, p.pin)
             : p.action === 'lock' ? apiLock(p.token) : apiGet(p.token);
    res = { ok: true, app: 'badyet', version: 8, data: data };
  }
  catch (err) { res = { ok: false, error: String((err && err.message) || err) }; }
  if (cb) {
    return ContentService.createTextOutput(cb + '(' + JSON.stringify(res) + ');')
      .setMimeType(ContentService.MimeType.JAVASCRIPT);
  }
  return out_(res);
}

function doPost(e) {
  try {
    var body = JSON.parse((e && e.postData && e.postData.contents) || '{}');
    if (body.action === 'auth') return out_({ ok: true, data: apiAuth(body.op, body.payload || {}, body.token) });
    var data = body.action === 'replace' ? apiReplace(body.data, body.token)
             : body.action === 'apply' ? apiApply(body.ops, body.token)
             : body.action === 'unlock' ? apiUnlock(body.pin)
             : body.action === 'setpin' ? apiSetPin(body.token, body.pin)
             : body.action === 'lock' ? apiLock(body.token) : apiGet(body.token);
    return out_({ ok: true, data: data });
  } catch (err) {
    return out_({ ok: false, error: String((err && err.message) || err) });
  }
}

function out_(o) {
  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);
}

/* ---- Called directly by the hosted page (google.script.run) ---- */
function apiGet(token) {
  var g = gate_(token); if (g) return g;
  return withLock_(readAll_, 8000);
}
function apiApply(ops, token) {
  var g = gate_(token); if (g) return g;
  return withLock_(function () {
    ensureSheets_();
    var byTable = {};
    (ops || []).forEach(function (op) {
      if (!SCHEMA[op.table]) return;
      var b = byTable[op.table] = byTable[op.table] || { ups: [], dels: [] };
      if (op.op === 'upsert') b.ups = b.ups.concat(op.rows || []);
      if (op.op === 'delete') b.dels = b.dels.concat(op.keys || []);
    });
    Object.keys(byTable).forEach(function (t) { applyTable_(t, byTable[t].ups, byTable[t].dels, false); });
    SpreadsheetApp.flush();
    return readAll_();
  }, 25000);
}
function apiReplace(data, token) {
  var g = gate_(token); if (g) return g;
  return withLock_(function () {
    ensureSheets_();
    Object.keys(SCHEMA).forEach(function (name) { applyTable_(name, (data && data[name]) || [], [], true); });
    SpreadsheetApp.flush();
    return readAll_();
  }, 25000);
}

/* ================= PIN lock =================
   The PIN is never stored: only a salted SHA-256 hash, in Script Properties
   (not in the sheet). A correct PIN gives the device a random key that lasts
   30 days. After 5 wrong tries, unlocking pauses for 5 minutes. */
var PIN_KEY = 'BADYET_PIN', TOK_KEY = 'BADYET_TOKENS', FAIL_KEY = 'BADYET_PIN_FAILS';
var TOKEN_DAYS = 30, MAX_TRIES = 5, WAIT_MIN = 5;
function props_() { return PropertiesService.getScriptProperties(); }
function hash_(salt, pin) {
  var b = Utilities.computeDigest(Utilities.DigestAlgorithm.SHA_256, salt + ':' + pin, Utilities.Charset.UTF_8);
  return b.map(function (x) { return ('0' + (x & 255).toString(16)).slice(-2); }).join('');
}
function pinOn_() { return !!props_().getProperty(PIN_KEY); }
function tokens_() { try { return JSON.parse(props_().getProperty(TOK_KEY) || '{}'); } catch (e) { return {}; } }
function saveTokens_(t) {
  var now = Date.now();
  Object.keys(t).forEach(function (k) { if (!(t[k] > now)) delete t[k]; });
  props_().setProperty(TOK_KEY, JSON.stringify(t));
}
function unlocked_(token) {
  if (!pinOn_()) return true;
  var t = tokens_();
  return !!(token && t[token] && t[token] > Date.now());
}
function locked_() { return { __locked: true, __pin: true }; }
function newToken_() {
  var t = tokens_(), k = (Utilities.getUuid() + Utilities.getUuid()).replace(/-/g, '');
  t[k] = Date.now() + TOKEN_DAYS * 86400000;
  saveTokens_(t);
  return k;
}
function apiUnlock(pin) {
  if (accountsOn_()) return { ok: false, error: 'Accounts are on. Log in with your username and password.' };
  return withLock_(function () {
    if (!pinOn_()) return { ok: true, token: '' };
    var p = props_(), now = Date.now();
    var f = String(p.getProperty(FAIL_KEY) || '0:0').split(':'), n = +f[0] || 0, until = +f[1] || 0;
    if (until > now) return { ok: false, wait: Math.ceil((until - now) / 1000) };
    var st = String(p.getProperty(PIN_KEY)).split(':');
    pin = str_(pin);
    if (st.length === 2 && /^\d{4,8}$/.test(pin) && hash_(st[0], pin) === st[1]) {
      p.setProperty(FAIL_KEY, '0:0');
      return { ok: true, token: newToken_() };
    }
    n++;
    if (n >= MAX_TRIES) { p.setProperty(FAIL_KEY, '0:' + (now + WAIT_MIN * 60000)); return { ok: false, wait: WAIT_MIN * 60 }; }
    p.setProperty(FAIL_KEY, n + ':0');
    return { ok: false, left: MAX_TRIES - n };
  }, 8000);
}
/* Set, change (pin = 4-8 digits) or remove (pin = '') the PIN. Needs an unlocked device. */
function apiSetPin(token, pin) {
  if (accountsOn_()) return { ok: false, error: 'Accounts are on, so the PIN is no longer used.' };
  return withLock_(function () {
    if (!unlocked_(token)) return locked_();
    var p = props_();
    pin = str_(pin);
    if (!pin) {
      [PIN_KEY, TOK_KEY, FAIL_KEY].forEach(function (k) { p.deleteProperty(k); });
      return { ok: true, pin: false };
    }
    if (!/^\d{4,8}$/.test(pin)) return { ok: false, error: 'Use 4 to 8 digits, numbers only.' };
    var salt = Utilities.getUuid();
    p.setProperty(PIN_KEY, salt + ':' + hash_(salt, pin));
    p.deleteProperty(TOK_KEY);          // every other device has to unlock again
    p.setProperty(FAIL_KEY, '0:0');
    return { ok: true, pin: true, token: newToken_() };
  }, 8000);
}
function apiLock(token) {
  var t = tokens_();
  if (token && t[token]) { delete t[token]; saveTokens_(t); }
  return { ok: true };
}
/* Badyet menu > Remove app PIN (only people who can edit the sheet can run it). */
function removeAppPin() {
  var p = props_();
  [PIN_KEY, TOK_KEY, FAIL_KEY].forEach(function (k) { p.deleteProperty(k); });
  try { SpreadsheetApp.getActive().toast('The app PIN is removed. Set a new one in the app under Settings.', 'Badyet', 8); } catch (e) {}
}

function withLock_(fn, ms) {
  var lock = LockService.getScriptLock();
  var got = false;
  try { got = lock.tryLock(ms); } catch (x) {}
  try { return fn(); }
  finally { if (got) { try { lock.releaseLock(); } catch (x) {} } }
}

/* ================= Helpers ================= */
function norm_(s) { return String(s == null ? '' : s).toLowerCase().replace(/[^a-z0-9]/g, ''); }
function str_(v) { return String(v == null ? '' : v).trim(); }
function isEmptyRow_(r) { return r.every(function (v) { return v === '' || v === null || v === undefined; }); }
function newId_(prefix) { return prefix + '-' + Utilities.getUuid().replace(/-/g, '').slice(0, 6).toUpperCase(); }
function listIndex_(name) { for (var i = 0; i < LISTS.length; i++) if (LISTS[i][0] === name) return i; return -1; }
function colLetter_(i) { var s = ''; i++; while (i > 0) { var m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; }
function kindOf_(name, key) { var c = SCHEMA[name].cols.filter(function (x) { return x[0] === key; })[0]; return c ? c[2] : 'text'; }
function toBool_(v) { return v === true || /^(true|yes|y|1|x)$/i.test(str_(v)); }

function label_(listName, v) {
  var s = str_(v);
  if (!s) return '';
  var i = listIndex_(listName);
  if (i < 0) return s;
  var n = norm_(s), opts = LISTS[i][1];
  for (var j = 0; j < opts.length; j++) if (norm_(opts[j]) === n) return opts[j];
  var syn = LIST_SYNONYMS[listName];
  return (syn && syn[n]) || s;
}

/* Clean one value for its column before writing it. */
function cleanValue_(kind, v) {
  if (v === null || v === undefined) return '';
  if (kind.indexOf('list:') === 0) return label_(kind.slice(5), v);
  if (kind === 'bool') return toBool_(v);
  if ((kind === 'money' || kind === 'number') && typeof v === 'string' && v.trim() !== '') {
    var n = parseFloat(v.replace(/[₱,\s]/g, ''));
    return isFinite(n) ? n : v;
  }
  return v;
}

/* Header row -> {key: column index}. */
function headMap_(name, head, loose) {
  var cols = SCHEMA[name].cols, map = {}, old = loose ? (OLD_HEADERS[name] || {}) : {};
  head.forEach(function (h, i) {
    var n = norm_(h);
    if (!n) return;
    for (var j = 0; j < cols.length; j++) {
      var k = cols[j][0];
      if (map[k] === undefined && (norm_(k) === n || norm_(cols[j][1]) === n)) { map[k] = i; return; }
    }
    if (old[n] && map[old[n]] === undefined) map[old[n]] = i;
  });
  return map;
}

function cell_(v, kind, tz) {
  if (v instanceof Date) return Utilities.formatDate(v, tz, kind === 'month' ? 'yyyy-MM' : 'yyyy-MM-dd');
  return v;
}

/* ================= Layout setup & migration ================= */
function ensureSheets_(force) {
  var ss = SS_(), props = PropertiesService.getScriptProperties();
  var have = ss.getSheets().map(function (s) { return s.getName(); });
  var complete = TAB_ORDER.every(function (t) { return have.indexOf(t) >= 0; });
  if (!force && complete && props.getProperty(layoutKey_(ss)) === LAYOUT_VERSION) return;
  setupLayout_();
  props.setProperty(layoutKey_(ss), LAYOUT_VERSION);
}

function setupLayout_() {
  var ss = SS_(), tz = ss.getSpreadsheetTimeZone();
  var oldCats = ss.getSheetByName('Categories');
  var oldCatRows = oldCats ? readOldCategories_(oldCats) : null;

  Object.keys(SCHEMA).forEach(function (name) {
    var t = SCHEMA[name], sh = ss.getSheetByName(t.title);
    var headers = t.cols.map(function (c) { return c[1]; });
    if (!sh) { sh = ss.insertSheet(t.title); rebuildTab_(sh, name, []); return; }
    var lc = Math.max(sh.getLastColumn(), 1);
    var head = sh.getRange(1, 1, 1, lc).getValues()[0].map(function (h) { return str_(h); });
    var same = head.length >= headers.length && headers.every(function (h, i) { return head[i] === h; });
    if (same) return;
    rebuildTab_(sh, name, readObjects_(sh, name, tz));   // migrate an older layout
  });

  if (oldCatRows) {   // old single "Categories" tab -> two tabs
    var exp = [], inc = [];
    oldCatRows.forEach(function (c) {
      if (c.kind === 'income') inc.push({ name: c.name });
      else exp.push({ name: c.name, essential: c.essential });
    });
    if (ss.getSheetByName('Expense Categories').getLastRow() <= 1) applyTable_('ExpenseCategories', exp, [], true);
    if (ss.getSheetByName('Income Categories').getLastRow() <= 1) applyTable_('IncomeCategories', inc, [], true);
    ss.deleteSheet(oldCats);
  }

  writeLists_();
  writeGuide_();
  Object.keys(SCHEMA).forEach(function (name) { styleSheet_(ss.getSheetByName(SCHEMA[name].title), name); });
  var s1 = ss.getSheetByName('Sheet1');
  if (s1 && s1.getLastRow() === 0 && ss.getSheets().length > 1) ss.deleteSheet(s1);
  orderTabs_();
}

function readOldCategories_(sh) {
  var vals = sh.getDataRange().getValues(), head = (vals[0] || []).map(norm_), out = [];
  var iN = head.indexOf('name'), iK = head.indexOf('kind'), iE = head.indexOf('essential');
  if (iN < 0) return out;
  for (var r = 1; r < vals.length; r++) {
    var n = str_(vals[r][iN]);
    if (!n) continue;
    out.push({ name: n, kind: iK >= 0 && norm_(vals[r][iK]) === 'income' ? 'income' : 'expense', essential: iE >= 0 && toBool_(vals[r][iE]) });
  }
  return out;
}

function readObjects_(sh, name, tz) {
  var vals = sh.getDataRange().getValues();
  var head = (vals[0] || []).map(function (h) { return str_(h); });
  var map = headMap_(name, head, true), out = [];
  for (var r = 1; r < vals.length; r++) {
    if (isEmptyRow_(vals[r])) continue;
    var o = {};
    SCHEMA[name].cols.forEach(function (c) {
      var j = map[c[0]];
      if (j !== undefined) o[c[0]] = cell_(vals[r][j], c[2], tz);
    });
    out.push(o);
  }
  return out;
}

/* Wipe a tab and write it in the current layout (new and migrated tabs). */
function rebuildTab_(sh, name, rows) {
  var f = sh.getFilter();
  if (f) f.remove();
  sh.getRange(1, 1, sh.getMaxRows(), sh.getMaxColumns()).clearDataValidations();
  sh.clear();
  var cols = SCHEMA[name].cols;
  sh.getRange(1, 1, 1, cols.length).setValues([cols.map(function (c) { return c[1]; })]);
  if (rows.length) applyTable_(name, rows, [], true);
}

function writeLists_() {
  var ss = SS_(), sh = ss.getSheetByName('Lists') || ss.insertSheet('Lists');
  var n = LISTS.length;
  var head = LISTS.map(function (l) { return l[0]; }).concat(['All categories', 'Budget categories']);
  sh.getRange(1, 1, 1, head.length).setValues([head]);
  LISTS.forEach(function (l, i) {   // fill a list only while it's empty, so your own edits stay
    var col = sh.getRange(2, i + 1, Math.max(sh.getMaxRows() - 1, 1), 1).getValues();
    var used = col.some(function (r) { return str_(r[0]) !== ''; });
    if (!used || l[0] === 'Plan groups') sh.getRange(2, i + 1, l[1].length, 1).setValues(l[1].map(function (v) { return [v]; }));
  });
  var E = "'Expense Categories'!B2:B", I = "'Income Categories'!B2:B";
  sh.getRange(2, n + 1).setFormula('=IFERROR(FILTER({' + E + ';' + I + '},{' + E + ';' + I + '}<>""),"")');
  sh.getRange(2, n + 2).setFormula('={"' + ALL_SPENDING + '";IFERROR(FILTER(' + E + ',' + E + '<>""),"")}');
  styleLists_(sh, head.length);
}
